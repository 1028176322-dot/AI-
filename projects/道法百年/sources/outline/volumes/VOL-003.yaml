  lowest_point: 工坊初建遭地方势力封锁，班底未稳，陷入资源窘境。
  climax: 卷终江湖大宗门围剿，肖凡以灵气火器破局，声望鹊起。
  aftermath: 班底封赏，江湖格局重写，FB-09余波牵出更高层。
