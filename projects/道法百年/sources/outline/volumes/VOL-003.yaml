  purpose: 大晟江湖游历收班底，科技产业化，初触宗师级，玉佩七境界推进至易筋。
  objective: 组建核心团队；灵气火器雏形落地；以越阶战低宗师立威；FB-06、FB-09 江湖线回收。
  start_state: 1388 肖凡出盛京入江湖，班底雏形，火器工坊起步。
  end_state: 1392 江湖大宗门围剿被灵气火器破局，肖凡声望鹊起，班底成型。
