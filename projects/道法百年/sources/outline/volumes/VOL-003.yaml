    - 沈遇(班底)
    - 江湖宗师
    - 黑虎帮幕后
    - 苏墨凝
  main_locations:
    - 大晟江湖
    - 诸道州府
    - 火药工坊
  central_conflict: 江湖宗门垄断 vs 科技产业化破局；越阶挑战 vs 金身/化罡极限认知。
  antagonist_pressure: 大宗门围剿；黑虎帮幕后（FB-09余波）；宗师级压制。
  milestones:
    - 初入江湖立规矩（251-275）
