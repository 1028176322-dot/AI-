series:
  id: SERIES-001
  total_chapters: 1000
  premise: 穿越者肖凡携破碎玉佩降生于修真世界，以黑火药与燧发枪等科技手段碾压武道，于长生宿命与朝堂暗线中走出一条'道士也玩火力覆盖'的癫狂之路。
  story_promise: 每一章都有爽点：科技降维打击、扮猪吃虎、以技破武；同时一条长生暗线贯穿始终，悬疑与揭秘并行。
  protagonist: 肖凡——清虚观遗弃孤儿，玉佩载体，科技+修炼双修，藏拙而狠厉。
  central_conflict: 凡俗科技理性 vs 修真世界武道霸权；个体长生宿命 vs 朝堂/听雨阁多方暗线绞杀。
  ending_direction: 三次大劫圆满，半步陆仙极境；听雨阁余孽、三皇子残余、狄族联盟最终清算；长生者肖凡与新国师收官，天下归静。
  major_truths:
    - 长生不是恩赐而是更重的劫数（FB-03 呼应）
    - 科技碾压的本质是认知维度差，而非单纯火力
    - 藏拙不是懦弱，是长生者必须的生存策略
    - 朝堂暗线的尽头是听雨阁与更高层势力的博弈
  major_arcs:
    - 成长弧：铁皮→铜骨→金身→化罡→七境界→归元→陆仙（1→1000）
    - 科技弧：黑火药→燧发枪→火器产业化→灵气火器→终极碾压
    - 暗线弧：FB-01~FB-09 埋设→卷二初交锋→卷四全面对抗→卷六清算
    - 长生弧：玉佩灌顶→驻颜启动→返老还童→三次大劫
  growth_tracks:
    power: 凡俗武道 + 玉佩七境界 + 科技线三线并进
    social: 孤童→商贾→朝堂势力幕后→长生者
    psych: 懵懂藏拙→认清宿命→主动布局
  global_milestones:
    - 卷一末：进京立足，仙人醉出世（1386）
    - 卷二末：天上人间压垮醉仙楼，听雨阁初交锋
    - 卷三末：江湖大宗门围剿被灵气火器破局
    - 卷四末：国战大决战，听雨阁主力受挫
    - 卷五末：归元突破+驻颜启动，狄族退却
    - 卷六末：域外终极一战，天下归静
  pacing_policy: 前期（卷一~二）每章一爽点高密度；中期（卷三~四）打脸+战争爽交替；长弧卷（卷五~六）慢节奏铺垫长生悬疑，关键 beat 提速。禁止连续>2章 transition 注水。
  forbidden_directions:
    - 不得让肖凡过早暴露玉佩全貌（前期必须藏拙）
    - 不得让科技线脱离认知维度差的合理边界（禁止无代价碾压）
    - 不得让长生宿命变成廉价永生（FB-03 劫数约束）
    - 不得破坏已确认六卷时间锚点（1370 出生 / 1396 卷五 / 1410 卷六）
