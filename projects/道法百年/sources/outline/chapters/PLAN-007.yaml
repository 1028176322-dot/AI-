    type: action
    purpose: 试感气（约450字）
    location: 某夜榻上打坐。
    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 肖凡依功法引气，前两次无感；第三次丹田忽涌温热，如温水漫开——气感境成。
    turn: 发展
    exit_state: 本章节拍收束
    environment_function: 丹田热流顺任脉上行；指尖微麻；呼吸不自觉转深长。
