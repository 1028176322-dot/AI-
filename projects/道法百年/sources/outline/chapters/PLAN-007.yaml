    type: revelation
    purpose: 刮硝土（约450字）
    location: 日间，观墙根与旱厕旁。
    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 肖凡借"帮观里取土补墙"之名，刮老墙根白霜硝土、铲旱厕土墙硝晶，分袋藏后山。
    turn: 转折
