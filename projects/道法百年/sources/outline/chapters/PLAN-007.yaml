    type: transition
    purpose: 炼硝试验（约450字）
    location: 后山僻处，小灶试验。
    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 肖凡淋滤硝土、熬煮收晶，得粗硝少许；知纯度远不及现代，需反复提纯。宋明翻书提某草"性寒解毒"，肖凡旁敲记其性味，暗对药方（FB-006 推进）。
