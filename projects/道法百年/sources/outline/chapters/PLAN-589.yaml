      - 肖凡"横练挡刀，挡不住灵火与无烟火药射程；罡气挡得住刀，挡不住狙枪"；言先生色变。
    turn: 发展
    exit_state: 大爽（科技碾压·破武者+宗师）。
    environment_function: 硝烟橘黄夹青芒漫雪；弹着衣裂渗红焦卷；宗师倒；炉风带硝味刺鼻。
