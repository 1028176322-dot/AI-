  plot: 国战大决战（FB-074）肖凡破听雨主力、压虞国攻势收束：以狙枪破宗师（FB-065）+灵火破武者（FB-049）+洗髓越阶（FB-066）+军籍体制（FB-078）多碾压。卷四大高潮收束，R1/R4/R5/R17/R19 严守。FB-074 决战推进（破主力·受挫未灭）。
  character: 角色成长：肖凡、老柯/沈遇/苏墨凝、言先生、虞国将领
