    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 肖凡明"国战大决战破听雨主力（FB-074），技破武·国战声望立（FB-068）"；收束幕四前半，钩卷四后续（FB-075 属幕五不植）。末句定调。
    turn: 收束钩
    exit_state: 卷四前半收束+钩子。
    environment_function: 册页满折痕记决战；灯花爆；雪光映窗；他指节扣，唇角微扬。
