objectives:
  plot: 国师密令至南州，虞国北境边衅初现，肖凡立判国战将启。建立北境战场空间锚点（FB-079），承接幕一皇权火并余波，铺以技破武·国战（FB-068）与狙击枪研发（FB-065）之前置。布局爽点，R11/R17 严守。FB-079 埋设；FB-062/FB-070/FB-064 推进。
  character: 角色成长：肖凡、玄尘子、苏墨凝
  reader: 读者获得本章事件推进与情绪/信息收益
  arc_progress: 推进所在幕(ARC-020)/卷(VOL-004)叙事
