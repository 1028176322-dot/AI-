      rhythm: 中
      sensory_focus: 具体感官
      information_method: 动作呈现
      rationale: 贴合本章基调与红线
    red_line_refs: []
  - id: beat-2
    type: action
    purpose: 科技碾压（约450字）
    location: 肖凡以技破武立威。
    participants:
      - 肖凡
      - 秦烈
    entry_condition: 承接上节拍/前序关联
    beats:
      - 肖凡以无烟火药后装枪（FB-048/FB-064）破虞国武者前营、灵火（FB-049）补侧隙——以技破武·国战声望立（FB-068）；老柯供械、候鹰探敌。
      - 肖凡"横练挡得住刀，挡不住无烟神火与射速"；秦烈"肖家神火名不虚传"。
    turn: 发展
    exit_state: 中爽（科技碾压·国战声望）。
    environment_function: 硝烟橘黄夹青芒漫雪；弹着衣裂渗红焦卷；武者踉跄退；炉风带硝味刺鼻。
    technique:
      dominant: environmental_pressure
      supporting:
        - action_causality
        - spatial_clarity
      rhythm: 中
      sensory_focus: 硝烟橘黄夹青芒漫雪；弹着衣裂渗红焦卷；武者踉跄退；炉风带硝味刺鼻。
      information_method: 肖凡"横练挡得住刀，挡不住无烟神火与射速"；秦烈"肖家神火名不虚传"。
      rationale: 贴合本章基调与红线
    red_line_refs: []
  - id: beat-3
    type: revelation
    purpose: 班底定鼎（约450字）
    location: 战争班底承线。
    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 陆敬参谋算势、候鹰斥候探敌、韩铸军械供枪、方牧边军联络——四司嵌入边军（FB-076 定鼎）；卷三班底（FB-063）承线。
    turn: 转折
    exit_state: 中爽（班底定鼎）。
    environment_function: 架构图铺案；茶烟袅；灯花爆；营火暖。
    technique:
      dominant: fair_clue_placement
      supporting:
        - contrast_reveal
        - delayed_naming
      rhythm: 中
      sensory_focus: 架构图铺案；茶烟袅；灯花爆；营火暖。
      information_method: 动作呈现
      rationale: 贴合本章基调与红线
    red_line_refs: []
  - id: beat-4
    type: action
    purpose: 听雨升格（约450字）
    location: 总坛对峙。
    participants:
      - 肖凡
      - 苏墨凝
    entry_condition: 承接上节拍/前序关联
    beats:
      - 听雨虞国总坛（FB-072/FB-012/FB-057，花无影主、言先生续承）全面对抗升格，肖凡留为幕四决战钩；不妄动。
      - 苏墨凝"总坛通款临潢"；肖凡"留它与幕四算"。
    turn: 高潮
    exit_state: 中爽（暗线升格·布局）。
    environment_function: 总坛图墨线；南音客袖纹复现；朔风卷雪。
    technique:
      dominant: limited_pov_filter
      supporting:
        - action_causality
        - spatial_clarity
      rhythm: 中
      sensory_focus: 总坛图墨线；南音客袖纹复现；朔风卷雪。
      information_method: 苏墨凝"总坛通款临潢"；肖凡"留它与幕四算"。
      rationale: 贴合本章基调与红线
    red_line_refs: []
  - id: beat-5
    type: action
    purpose: 研发近成（约450字）
    location: 狙击枪雏形。
    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 老柯呈狙击枪（FB-065）雏形：线膛精度、无烟火药定装、机械瞄具校合——研发近成，幕三成对宗师致命（解 FB-042/R4）；本段仍守对宗师基本无效。
    turn: 收束
    exit_state: 中爽（研发近成·蓄势）。
    environment_function: 枪管泛青晕；弹壳沉坠；靶纸洞圆；他眯眼校。
    technique:
      dominant: action_causality
      supporting:
        - spatial_clarity
        - environmental_pressure
      rhythm: 中
      sensory_focus: 枪管泛青晕；弹壳沉坠；靶纸洞圆；他眯眼校。
      information_method: 动作呈现
      rationale: 贴合本章基调与红线
    red_line_refs: []
  - id: beat-6
    type: action
    purpose: 幕二终（约450字）
    location: 肖凡立台，望北境。
    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 肖凡明"北境初成格局、以技破武声望立、战争班底定鼎、狙击枪近成"；收束幕二，钩幕三狙击枪破宗师（FB-042/FB-065）、灵气火器战场化（FB-049）、洗髓（FB-066）。末句定调。
    turn: 收束钩
    exit_state: 幕二收束+钩子。
    environment_function: 私册满折痕记北境；灯花爆；雪光映窗；他指节扣，唇角微扬。
    technique:
      dominant: spatial_clarity
      supporting:
        - action_causality
        - environmental_pressure
      rhythm: 中
      sensory_focus: 私册满折痕记北境；灯花爆；雪光映窗；他指节扣，唇角微扬。
      information_method: 动作呈现
      rationale: 贴合本章基调与红线
