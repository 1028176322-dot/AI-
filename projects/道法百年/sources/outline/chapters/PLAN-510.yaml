objectives:
  plot: 幕二收束：北境初成格局——虞国国战（FB-071）相持、以技破武声望立（FB-068）、战争班底定鼎（FB-076）、狙击枪研发近成（FB-065）、听雨全面对抗升格（FB-072）。肖凡布局者收束，钩幕三狙击枪破宗师（FB-042）。R1/R4/R5/R17/R19 严守。
  character: 角色成长：肖凡、老柯/沈遇/苏墨凝
  reader: 读者获得本章事件推进与情绪/信息收益
  arc_progress: 推进所在幕(ARC-021)/卷(VOL-004)叙事
