    type: transition
    purpose: 北境定（约450字）
    location: 永熙二十七年冬，朔方镇，北境格局成。
    participants:
      - 肖凡
      - 苏墨凝
      - 秦烈
    entry_condition: 本章开场
    beats:
      - 肖凡立台望北境：三镇联防（FB-079）、黑水河相持（FB-071）、战争班底（FB-076）定鼎；老柯备械、苏墨凝汇线、秦烈守镇。
    turn: 开场
    exit_state: 幕二收束前奏。
    environment_function: （感官细节见细节锚点）
    technique:
      dominant: controlled_ellipsis
