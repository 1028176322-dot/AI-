  desire: 主角意欲推进之事（见摘要）
  opposition: 阻力/反方（见摘要与设定）
  stakes: 成败利害（见设定与余波）
  dilemma: 两难取舍（见撰写备注）
  escalation: 冲突升级路径（见节拍分解）
scenes:
  - id: beat-1
    type: transition
    purpose: 问修炼（约450字）
    location: 永熙十年晨课后，师徒扫院闲谈。
    participants:
      - 肖凡
      - 无为子
    entry_condition: 本章开场
    beats:
      - 肖凡佯作童稚好奇，问"人能否练到刀枪不入、活过百岁"。无为子笑答可讲。
      - 肖凡"师父，世上最强者能活多久？"；无为子"你这小子，想得倒远"。
    turn: 开场
    exit_state: 本章节拍收束
    environment_function: （感官细节见细节锚点）
    technique:
      dominant: controlled_ellipsis
      supporting:
        - temporal_compression
        - scene_counterpoint
      rhythm: 中
      sensory_focus: 具体感官
      information_method: 肖凡"师父，世上最强者能活多久？"；无为子"你这小子，想得倒远"。
      rationale: 贴合本章基调与红线
    red_line_refs:
      - R17
      - R18
  - id: beat-2
    type: action
    purpose: 讲横练（约450字）
    location: 扫院不停，师父边讲边示范。
    participants:
      - 无为子
    entry_condition: 承接上节拍/前序关联
    beats:
      - 无为子讲横练三阶——铁皮抗钝器、铜骨抗刀剑、金身寻常兵刃难伤；但单修暗伤累积，四五十岁身体崩坏。
    turn: 发展
    exit_state: 本章节拍收束
    environment_function: （感官细节见细节锚点）
    technique:
      dominant: environmental_pressure
      supporting:
        - action_causality
        - spatial_clarity
      rhythm: 中
      sensory_focus: 具体感官
      information_method: 动作呈现
      rationale: 贴合本章基调与红线
    red_line_refs:
      - R12
      - R14
  - id: beat-3
    type: revelation
    purpose: 讲内力与双修（约450字）
    location: 讲至内力。
    participants:
      - 肖凡
      - 无为子
    entry_condition: 承接上节拍/前序关联
    beats:
      - 无为子讲内力三阶气感→周天→化罡（外放成罡）；内力滋养暗伤、延年但有承载极限；双修互补；宗师=金身+化罡，寿约百二十。
      - 无为子"宗师已是凡人顶点"；肖凡"那长生呢？"
    turn: 转折
    exit_state: 本章节拍收束
    environment_function: （感官细节见细节锚点）
    technique:
      dominant: fair_clue_placement
      supporting:
        - contrast_reveal
        - delayed_naming
      rhythm: 中
      sensory_focus: 具体感官
      information_method: 无为子"宗师已是凡人顶点"；肖凡"那长生呢？"
      rationale: 贴合本章基调与红线
    red_line_refs:
      - R12
      - R14
  - id: beat-4
    type: transition
    purpose: 否定长生（约400字）
    location: 无为子正色。
    participants:
      - 肖凡
      - 无为子
    entry_condition: 承接上节拍/前序关联
    beats:
      - 无为子明确"古来无人长生，皆是妄谈"。肖凡心中对比脑中引灵气功法，确认是另一条路，表面信服、内里更坚定保密（FB-005 深化）。
    turn: 收尾
    exit_state: 师父说无长生，可他识海里那套功法，末段写的恰是"驻世久长"。
    environment_function: （感官细节见细节锚点）
    technique:
