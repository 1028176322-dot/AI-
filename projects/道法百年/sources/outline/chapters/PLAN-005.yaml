objectives:
  plot: 肖凡早课后问师父修炼与长生之事。无为子讲本世界体系：横练铁皮→铜骨→金身（单修暗伤累积、活不久）；内力气感→周天→化罡（滋养暗伤、延年但有承载极限）；双修互补；宗师=金身+化罡，寿约120岁。师父明确否定长生（古来无人做到）。肖凡内心对比脑中引灵气功法，确信是另一条路，决心保密。
  character: 角色成长：无为子、肖凡
  reader: 读者获得本章事件推进与情绪/信息收益
  arc_progress: 推进所在幕(ARC-001)/卷(VOL-001)叙事
