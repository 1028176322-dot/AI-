starting_state:
  time: 永熙十年(1377年)·肖凡7岁（第5章当夜及次日）
  location: 永熙十年夜，清虚观后院老槐树下；师兄寝息后。
  protagonist_state: 永熙十年(1377年)·肖凡7岁（第5章当夜及次日）；肖凡主线推进中
  reader_knows: 读者已知前情与既有伏笔（见前序关联）
  reader_does_not_know: 本章将揭示/推进的未知走向
objectives:
  plot: 当夜师兄睡后，肖凡溜后院老槐树下首次练炼体前六式。动作比推演难（身体柔韧是小孩优势）。练完精神清明。忽冒念头「武功再高也怕火药」，反思需先确认本世界有无黑火药材料。次日向师父打听「黑色粉末遇火就炸」，师父说方士用石硫黄（药铺有卖），肖凡认出即硫磺——黑火药第一块拼图；硝石无人识，但知可自提（老墙根白霜、旱厕土墙）。
  character: 角色成长：肖凡、无为子
  reader: 读者获得本章事件推进与情绪/信息收益
  arc_progress: 推进所在幕(ARC-001)/卷(VOL-001)叙事
conflict:
  desire: 主角意欲推进之事（见摘要）
  opposition: 阻力/反方（见摘要与设定）
  stakes: 成败利害（见设定与余波）
  dilemma: 两难取舍（见撰写备注）
  escalation: 冲突升级路径（见节拍分解）
scenes:
  - id: beat-1
    type: transition
    purpose: 初练（约450字）
    location: 永熙十年夜，清虚观后院老槐树下；师兄寝息后。
    participants:
      - 肖凡
    entry_condition: 本章开场
    beats:
      - 肖凡溜至老槐树，按脑中炼体前六式第一段逐一试练；推演觉简单，实操方知孩童筋骨柔韧是优势也是限制——拉伸酸胀、呼吸节奏需自调。
    turn: 开场
    exit_state: 本章节拍收束
    environment_function: （感官细节见细节锚点）
    technique:
      dominant: controlled_ellipsis
      supporting:
        - temporal_compression
        - scene_counterpoint
      rhythm: 中
      sensory_focus: 具体感官
      information_method: 动作呈现
      rationale: 贴合本章基调与红线
    red_line_refs:
      - R11
      - R12
  - id: beat-2
    type: action
    purpose: 体感（约400字）
    location: 同夜，练完六式就地调息。
    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 肖凡察觉精神较往日清明，周身微热如浸温水；握拳指节发胀感比上月明显；暗自对照前几月变化曲线。
    turn: 发展
    exit_state: 本章节拍收束
    environment_function: 掌心汗渍月光下反微光；远处观钟"当"一声惊起夜鸟。
    technique:
      dominant: environmental_pressure
      supporting:
        - action_causality
        - spatial_clarity
      rhythm: 中
      sensory_focus: 掌心汗渍月光下反微光；远处观钟"当"一声惊起夜鸟。
      information_method: 动作呈现
      rationale: 贴合本章基调与红线
    red_line_refs:
      - R12
      - R17
  - id: beat-3
    type: revelation
    purpose: 火药念头（约500字）
    location: 回卧房榻上复盘。
    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 肖凡忽生"武功再高也怕火药"之念——以现代轻武器知识反思：本世界武者再强遇黑火药亦难挡，但须先确认本世界有无此物。
    turn: 转折
    exit_state: 本章节拍收束
    environment_function: （感官细节见细节锚点）
    technique:
      dominant: fair_clue_placement
      supporting:
        - contrast_reveal
        - delayed_naming
      rhythm: 中
      sensory_focus: 具体感官
      information_method: 动作呈现
      rationale: 贴合本章基调与红线
    red_line_refs:
      - R1
      - R20
      - R17
  - id: beat-4
    type: action
    purpose: 问硫（约500字）
    location: 次日晨课后，丹房旁与师父闲话。
    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 肖凡装好奇问"有无黑色粉末遇火就炸"；师父随口答方士炼丹用"石硫黄"、药铺有售、效用驱邪避虫；肖凡心中一震——即硫磺。
      - 师父答非所问的随意（只当童言）；肖凡不动声色记"药铺可购硫"。
    turn: 次日
    exit_state: 本章节拍收束
    environment_function: 师父拂尘扫石阶灰；灶上药香混硫磺刺鼻。
    technique:
      dominant: limited_pov_filter
      supporting:
        - action_causality
        - spatial_clarity
      rhythm: 中
      sensory_focus: 师父拂尘扫石阶灰；灶上药香混硫磺刺鼻。
      information_method: 师父答非所问的随意（只当童言）；肖凡不动声色记"药铺可购硫"。
      rationale: 贴合本章基调与红线
    red_line_refs:
      - R1
      - R2
      - R16
      - R17
  - id: beat-5
    type: transition
    purpose: 补硝（约500字）
    location: 当日午后，藏书阁翻阅，宋明在侧。
    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 肖凡推演缺"硝石"；回想现代：硝石可自老墙根白霜、旱厕土墙淋滤提取；定下刮硝土计划，盘算纯度与配比试验。
    turn: 收尾
    exit_state: 明日始刮硝——黑火药拼图第一块将落。
    environment_function: 指尖沾旧墙硝霜尝咸涩；宋明翻书页声。
    technique:
      dominant: temporal_compression
      supporting:
        - controlled_ellipsis
        - scene_counterpoint
      rhythm: 中
      sensory_focus: 指尖沾旧墙硝霜尝咸涩；宋明翻书页声。
      information_method: 动作呈现
      rationale: 贴合本章基调与红线
    red_line_refs:
      - R1
      - R3
      - R16
      - R19
  - id: beat-6
    type: action
    purpose: 反差（约300字）
    location: 夜，观外远山。
    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 七岁娃独立崖边，心中已绘改变世界的武器蓝图，与周遭宁静夜色成反差。
    turn: 闲笔
    exit_state: 本章节拍收束
    environment_function: （感官细节见细节锚点）
    technique:
      dominant: spatial_clarity
      supporting:
        - action_causality
        - environmental_pressure
      rhythm: 中
      sensory_focus: 具体感官
      information_method: 动作呈现
      rationale: 贴合本章基调与红线
    red_line_refs:
      - R17
      - R14
