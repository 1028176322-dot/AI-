objectives:
  plot: 肖凡首次随师父远行州城办差，见识真正武者世界：一名宗师级人物路过，气息压迫令肖凡首次直观感知「化罡宗师」之强。旁听州城百姓议朝堂：大皇子萧恒留守、二皇子萧厉辅政、三皇子萧沛书院、四皇子萧俊年幼。肖凡记下四皇子名单（政治伏笔）。
  character: "角色成长：肖凡、无为子、宗师(路遇,未名)、萧恒/萧厉/萧沛/萧俊(提及)"
  reader: 读者获得本章事件推进与情绪/信息收益
  arc_progress: 推进所在幕(ARC-001)/卷(VOL-001)叙事
