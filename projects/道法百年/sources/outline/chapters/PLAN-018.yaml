    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 肖凡对照火绳枪——对宗师基本无效（R4/R6 印证）；知科技非万能，须"科技+修炼"错位方长。不妄断，记"宗师不可轻撼"。
    turn: 收尾
    exit_state: 这天下，有比火药更硬的东西。
