  - id: beat-2
    type: action
    purpose: 宗师压迫（约450字）
    location: 州城门外，一行人路过。
    participants:
      - 肖凡
      - 无为子
    entry_condition: 承接上节拍/前序关联
    beats:
      - 一灰袍老者缓步而过，气息如山压下，肖凡呼吸一滞、后背发紧——初次亲感化罡宗师之强。无为子低声"莫直视"。
    turn: 发展
    exit_state: 本章节拍收束
    environment_function: 老者衣角无风自动；肖凡掌心骤汗；周遭喧闹似被压低一瞬。
    technique:
      dominant: environmental_pressure
      supporting:
        - action_causality
        - spatial_clarity
      rhythm: 中
      sensory_focus: 老者衣角无风自动；肖凡掌心骤汗；周遭喧闹似被压低一瞬。
