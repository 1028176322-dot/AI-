      - R4
      - R6
      - R12
  - id: beat-3
    type: revelation
    purpose: 议朝堂（约450字）
    location: 州城茶肆，百姓闲谈入耳。
    participants:
      - 肖凡
      - 三皇子
      - 四皇子
      - 萧俊
    entry_condition: 承接上节拍/前序关联
    beats:
      - 肖凡听百姓议朝堂——大皇子萧恒留守盛京、二皇子萧厉辅政、三皇子萧沛掌书院、四皇子萧俊年幼。肖凡默记四皇子名单（FB-010）。
      - 茶客"二殿下近来风头盛"；另一"三殿子只读书"。
    turn: 转折
    exit_state: 本章节拍收束
    environment_function: （感官细节见细节锚点）
