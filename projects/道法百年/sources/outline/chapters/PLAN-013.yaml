  desire: 主角意欲推进之事（见摘要）
  opposition: 阻力/反方（见摘要与设定）
  stakes: 成败利害（见设定与余波）
  dilemma: 两难取舍（见撰写备注）
  escalation: 冲突升级路径（见节拍分解）
scenes:
  - id: beat-1
    type: transition
    purpose: 备料（约450字）
    location: 后山，肖凡取观中废弃铁管（原盛油）、木托、自制药粉、铅弹。
    participants:
      - 肖凡
    entry_condition: 本章开场
    beats:
      - 肖凡据图组装：管塞木托、钻引信孔、填药室。知密封是成败关键。
    turn: 开场
    exit_state: 本章节拍收束
    environment_function: （感官细节见细节锚点）
    technique:
      dominant: controlled_ellipsis
      supporting:
        - temporal_compression
        - scene_counterpoint
      rhythm: 中
      sensory_focus: 具体感官
      information_method: 动作呈现
      rationale: 贴合本章基调与红线
    red_line_refs:
      - R16
      - R19
  - id: beat-2
    type: action
    purpose: 失败×2（约450字）
    location: 首次试射。
    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 第一枪火绳引燃慢、漏气无力；第二枪封口不严密炸膛（管裂未伤人）。肖凡不馁，判为密封与引信问题。
    turn: 发展
    exit_state: 本章节拍收束
    environment_function: 漏气声"噗"如泄气；炸膛脆响惊飞鸟；他袖口被崩屑划道白痕。
    technique:
      dominant: environmental_pressure
      supporting:
        - action_causality
        - spatial_clarity
      rhythm: 中
      sensory_focus: 漏气声"噗"如泄气；炸膛脆响惊飞鸟；他袖口被崩屑划道白痕。
      information_method: 动作呈现
      rationale: 贴合本章基调与红线
    red_line_refs:
      - R4
      - R19
      - R12
  - id: beat-3
    type: revelation
    purpose: 首中（约450字）
    location: 改良后再试。
    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 肖凡加麻绳缠封药室、调引信长度；第三枪"轰"一声，铅弹嵌进树干三寸。小爽点达成——科技可破武。
    turn: 转折
    exit_state: 本章节拍收束
    environment_function: 枪口烟如灰蛇；树干裂口木刺外翻；他耳膜嗡了半晌。
    technique:
      dominant: fair_clue_placement
      supporting:
        - contrast_reveal
        - delayed_naming
      rhythm: 中
      sensory_focus: 枪口烟如灰蛇；树干裂口木刺外翻；他耳膜嗡了半晌。
      information_method: 动作呈现
      rationale: 贴合本章基调与红线
    red_line_refs:
      - R1
      - R4
      - R12
  - id: beat-4
    type: transition
    purpose: 记改进（约400字）
    location: 肖凡拔弹验痕。
    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 肖凡判射程近、精度差，远不胜弓；记下改进方向（密封、膛线雏形、定装药）。不膨胀。
    turn: 收尾
    exit_state: 能打了，但还不够准。
    environment_function: （感官细节见细节锚点）
    technique:
      dominant: symbolic_echo
      supporting:
        - temporal_compression
        - controlled_ellipsis
      rhythm: 中
      sensory_focus: 具体感官
      information_method: 动作呈现
      rationale: 贴合本章基调与红线
    red_line_refs:
      - R6
      - R17
