  reader_does_not_know: 本章将揭示/推进的未知走向
objectives:
  plot: 肖凡在后山秘密用观中废弃铁管+自制药粉试制火绳枪，经数次失败（漏气、炸膛），终首射命中树干。小爽点：亲手验证「科技可破武」。但射程近、精度差，肖凡记下改进方向（密封、膛线雏形）。
  character: 角色成长：肖凡
  reader: 读者获得本章事件推进与情绪/信息收益
  arc_progress: 推进所在幕(ARC-001)/卷(VOL-001)叙事
