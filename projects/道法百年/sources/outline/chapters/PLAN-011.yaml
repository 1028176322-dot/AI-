        - temporal_compression
        - scene_counterpoint
      rhythm: 中
      sensory_focus: 具体感官
      information_method: 动作呈现
      rationale: 贴合本章基调与红线
    red_line_refs:
      - R3
      - R19
      - R16
  - id: beat-2
    type: action
    purpose: 定配比（约450字）
    location: 配比推演。
    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 肖凡依现代知识定硝/硫/炭 approximate 比例，记"硝多则猛、硫多则燃速快、炭为骨架"；知需反复试。
    turn: 发展
    exit_state: 本章节拍收束
    environment_function: （感官细节见细节锚点）
    technique:
      dominant: environmental_pressure
      supporting:
        - action_causality
        - spatial_clarity
      rhythm: 中
      sensory_focus: 具体感官
      information_method: 动作呈现
      rationale: 贴合本章基调与红线
    red_line_refs:
      - R1
      - R2
      - R19
  - id: beat-3
    type: revelation
    purpose: 首配黑火药（约450字）
    location: 后山，混合三粉。
    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 肖凡谨慎混出黑粉一握，色黑如墨；嗅之微辛。确认本世界无人识此物（R2 严守）。
    turn: 转折
    exit_state: 本章节拍收束
    environment_function: 三粉入钵研磨声沙沙；粉沾袖口难掸；风过扬起黑尘。
    technique:
      dominant: fair_clue_placement
      supporting:
        - contrast_reveal
        - delayed_naming
      rhythm: 中
      sensory_focus: 三粉入钵研磨声沙沙；粉沾袖口难掸；风过扬起黑尘。
      information_method: 动作呈现
      rationale: 贴合本章基调与红线
    red_line_refs:
      - R2
      - R12
  - id: beat-4
    type: transition
    purpose: 试爆+密记（约450字）
    location: 远崖试爆。
    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 肖凡引长绳远抛小撮黑粉，火折点引——轰然一声，碎石飞溅，威力远超预期。他心头一震，随即压住；将配方与提纯法刻入脑海，外不示人。
    turn: 收尾
    exit_state: 火药成了，下一步是把它送出去。
    environment_function: （感官细节见细节锚点）
    technique:
      dominant: symbolic_echo
      supporting:
        - temporal_compression
        - controlled_ellipsis
      rhythm: 中
      sensory_focus: 具体感官
      information_method: 动作呈现
      rationale: 贴合本章基调与红线
    red_line_refs:
      - R1
      - R17
      - R19
      - R12
