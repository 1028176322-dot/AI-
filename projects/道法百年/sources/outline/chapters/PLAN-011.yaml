  dilemma: 两难取舍（见撰写备注）
  escalation: 冲突升级路径（见节拍分解）
scenes:
  - id: beat-1
    type: transition
    purpose: 稳定提纯（约450字）
    location: 永熙十三年，后山僻灶。
    participants:
      - 肖凡
    entry_condition: 本章开场
    beats:
      - 肖凡经数年试错，终稳定提纯硝石——淋滤、沉淀、熬晶、重结晶，得近白硝晶。知纯度仍逊 modern，但可用。
    turn: 开场
    exit_state: 本章节拍收束
    environment_function: （感官细节见细节锚点）
    technique:
      dominant: controlled_ellipsis
