objectives:
  plot: 经数年摸索，肖凡在后山稳定提纯硝石，确认黑火药三要素配比（硝/硫/炭）。首次配出黑色粉末，小心试爆（小块），威力远超预期。确认本世界无人知此配方（R2）。肖凡将配方与提纯法密记于心，不示人。
  character: 角色成长：肖凡
  reader: 读者获得本章事件推进与情绪/信息收益
  arc_progress: 推进所在幕(ARC-001)/卷(VOL-001)叙事
