    red_line_refs:
      - R1
      - R2
      - R17
  - id: beat-3
    type: revelation
    purpose: 拆穿（约450字）
    location: 肖凡"请教"假道士。
    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 肖凡讨碗清水，撒石灰——水自发热；再滴矾水——色变。笑问"道长这神水，可会自热变色？"假道士语塞。村民哗然。
      - 肖凡"先生，这般神异，谁都会了"；假道士"你…你胡搅"。
    turn: 转折
    exit_state: 本章节拍收束
