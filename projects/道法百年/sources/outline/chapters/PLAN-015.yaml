objectives:
  plot: 山下村落来一「假道士」以符水骗钱，村民信以为真。肖凡路过拆穿：用基础化学（石灰遇水发热、矾水变色）演示「神迹」为假，反将假道士噎住。村民醒悟，假道士狼狈走。小打脸+知识降维爽点。
  character: 角色成长：肖凡、假道士(首次)
  reader: 读者获得本章事件推进与情绪/信息收益
  arc_progress: 推进所在幕(ARC-001)/卷(VOL-001)叙事
