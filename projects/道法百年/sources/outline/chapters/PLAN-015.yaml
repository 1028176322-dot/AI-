    type: action
    purpose: 肖凡路过（约450字）
    location: 肖凡村边过，驻足观。
    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 肖凡一眼识破（现代化学常识）；不动声色挤进人群，佯作好奇孩童。
    turn: 发展
    exit_state: 本章节拍收束
