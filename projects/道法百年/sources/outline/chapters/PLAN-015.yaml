    type: transition
    purpose: 狼狈（约400字）
    location: 假道士收摊遁走。
    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 村民醒悟讨钱，假道士狼狈溜；肖凡不居功，混入人流。村中自此传"清虚观小道士有点门道"。
    turn: 收尾
    exit_state: 知识，便是这世道最利的刀。
