  reader_does_not_know: 本章将揭示/推进的未知走向
objectives:
  plot: 肖凡试遍滴血、火烧、水泡、掰、砸探玉佩秘密，均无效。烦躁中玉佩脱手坠地碎裂，一道光从碎片飞出钻入眉心。脑中灌入：炼体十八式、七境界体系、三个回春药方。肖凡将暗淡碎片埋于老槐树下。
  character: 角色成长：肖凡
  reader: 读者获得本章事件推进与情绪/信息收益
  arc_progress: 推进所在幕(ARC-001)/卷(VOL-001)叙事
conflict:
  desire: 主角意欲推进之事（见摘要）
  opposition: 阻力/反方（见摘要与设定）
  stakes: 成败利害（见设定与余波）
  dilemma: 两难取舍（见撰写备注）
  escalation: 冲突升级路径（见节拍分解）
scenes:
  - id: beat-1
    type: transition
    purpose: 试玉（约450字）
    location: 永熙九年夏，肖凡房中，独对玉佩。
    participants:
      - 肖凡
    entry_condition: 本章开场
    beats:
      - 依次试滴血（无应）、火烧（温不烫）、水泡（沉不浮）、掰（纹丝不动）、砸（痕都不留）。每法无效，眉微蹙。
    turn: 开场
    exit_state: 本章节拍收束
    environment_function: （感官细节见细节锚点）
    technique:
      dominant: controlled_ellipsis
      supporting:
        - temporal_compression
        - scene_counterpoint
      rhythm: 中
      sensory_focus: 具体感官
      information_method: 动作呈现
      rationale: 贴合本章基调与红线
    red_line_refs:
      - R12
      - R16
  - id: beat-2
    type: action
    purpose: 烦躁坠地（约400字）
    location: 试法尽穷，肖凡心烦。
    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 肖凡手一松，玉佩脱手坠地——非失控，是试尽后的泄气。碎裂无声，一瞬光从缝中溢出。
    turn: 发展
    exit_state: 本章节拍收束
    environment_function: （感官细节见细节锚点）
    technique:
      dominant: environmental_pressure
      supporting:
        - action_causality
        - spatial_clarity
      rhythm: 中
      sensory_focus: 具体感官
      information_method: 动作呈现
      rationale: 贴合本章基调与红线
    red_line_refs:
      - R16
      - R14
  - id: beat-3
    type: revelation
    purpose: 灌顶（约500字）
    location: 光钻入眉心，肖凡僵坐。
    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 脑中涌出炼体十八式总纲（三段六式）、七境界名目、三张回春药方图文。信息庞大却清晰，如刻入识海。
    turn: 转折
    exit_state: 本章节拍收束
    environment_function: 眉心微烫；耳际嗡鸣一息即逝；眼前闪过功法图示残影。
    technique:
      dominant: fair_clue_placement
      supporting:
        - contrast_reveal
        - delayed_naming
      rhythm: 中
      sensory_focus: 眉心微烫；耳际嗡鸣一息即逝；眼前闪过功法图示残影。
      information_method: 动作呈现
      rationale: 贴合本章基调与红线
    red_line_refs:
      - R14
      - R17
  - id: beat-4
    type: transition
    purpose: 埋碎片（约400字）
    location: 夜，后院老槐树下。
    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 肖凡掘小坑埋暗淡碎片，平土掩饰。暗记方位，决心保密（FB-004）。
    turn: 收尾
    exit_state: 功法在脑，玉佩已碎，这条路只能他自己走。
    environment_function: （感官细节见细节锚点）
    technique:
      dominant: symbolic_echo
      supporting:
        - temporal_compression
        - controlled_ellipsis
      rhythm: 中
      sensory_focus: 具体感官
      information_method: 动作呈现
      rationale: 贴合本章基调与红线
    red_line_refs:
      - R17
      - R11
