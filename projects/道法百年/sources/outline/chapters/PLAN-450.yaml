        - environmental_pressure
      rhythm: 中
      sensory_focus: 册页满折痕记洗牌；灯花爆；雪光映窗；他指节扣，唇角微扬。
      information_method: 动作呈现
      rationale: 贴合本章基调与红线
    red_line_refs: []
