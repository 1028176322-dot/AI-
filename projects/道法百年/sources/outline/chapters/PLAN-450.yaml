objectives:
  plot: 江湖大宗门倾力围剿南州总号，肖凡以「科技（灵气火器 FB-049 破武者阵）+ 修炼（易筋 FB-053/金身圆满 FB-054 越阶）+ 制度（江湖籍 FB-009/FB-007 压宗门/官面）」三碾压破局。江湖声望鹊起，格局重定（FB-061 成），新贵定鼎（FB-060 呼应）。卷三收束，钩卷四国战（FB-062）。R1/R4/R5/R17/R19 严守。
  character: 角色成长：肖凡、老柯/沈遇/苏墨凝、宗师级人物、内卫府校尉
  reader: 读者获得本章事件推进与情绪/信息收益
  arc_progress: 推进所在幕(ARC-018)/卷(VOL-003)叙事
conflict:
  desire: 主角意欲推进之事（见摘要）
  opposition: 阻力/反方（见摘要与设定）
  stakes: 成败利害（见设定与余波）
  dilemma: 两难取舍（见撰写备注）
  escalation: 冲突升级路径（见节拍分解）
scenes:
  - id: beat-1
    type: transition
    purpose: 围剿临（约450字）
    location: 永熙二十五年冬，南州总号外，大宗门倾力围剿。
    participants:
      - 肖凡
    entry_condition: 本章开场
    beats:
      - 大宗门掌门率数十武者+宗师遥压合围总号；肖凡登台，老柯备双器、校尉持籍、青溪附侧。
    turn: 开场
    exit_state: 大高潮前奏。
    environment_function: （感官细节见细节锚点）
    technique:
      dominant: controlled_ellipsis
      supporting:
        - temporal_compression
        - scene_counterpoint
      rhythm: 中
      sensory_focus: 具体感官
      information_method: 动作呈现
      rationale: 贴合本章基调与红线
    red_line_refs: []
  - id: beat-2
    type: action
    purpose: 科技碾压（约450字）
    location: 肖凡以灵火破武者阵。
    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 肖凡引灵气（FB-003）入灵火枪（FB-049），连发破大宗门前锋武者阵——附灵气灼创令横练失能（FB-050）；老柯补后装枪（FB-048）速射封走位。
      - 肖凡"横练挡得住刀，挡不住灵火与射速"；掌门色变。
    turn: 发展
    exit_state: 大爽（科技碾压·破武者阵）。
    environment_function: 硝烟橘黄夹青芒漫雪；弹着衣裂渗红焦卷；武者踉跄退；炉风带硝味刺鼻。
    technique:
      dominant: environmental_pressure
      supporting:
        - action_causality
        - spatial_clarity
      rhythm: 中
      sensory_focus: 硝烟橘黄夹青芒漫雪；弹着衣裂渗红焦卷；武者踉跄退；炉风带硝味刺鼻。
      information_method: 肖凡"横练挡得住刀，挡不住灵火与射速"；掌门色变。
      rationale: 贴合本章基调与红线
    red_line_refs: []
  - id: beat-3
    type: revelation
    purpose: 修炼越阶（约450字）
    location: 肖凡越阶战精英。
    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 大宗门精英铜骨阵扑，肖凡以金身圆满（FB-054）硬承、易筋（FB-053）韧回，越阶反制精英——肉身双壁显。
    turn: 转折
    exit_state: 大爽（修炼越阶·破精英）。
    environment_function: 精英重锤落臂如中革回弹；肌肤淡金收；筋骨绷鸣如弦；雪地脚印乱。
    technique:
      dominant: fair_clue_placement
      supporting:
        - contrast_reveal
        - delayed_naming
      rhythm: 中
      sensory_focus: 精英重锤落臂如中革回弹；肌肤淡金收；筋骨绷鸣如弦；雪地脚印乱。
      information_method: 动作呈现
      rationale: 贴合本章基调与红线
    red_line_refs: []
  - id: beat-4
    type: action
    purpose: 制度压宗门（约450字）
    location: 宗师遥压，肖凡以籍破。
    participants:
      - 肖凡
      - 国师
      - 内卫府
    entry_condition: 承接上节拍/前序关联
    beats:
      - 宗师（FB-021/FB-042）遥压，肖凡亮江湖籍（FB-009）+ 国师令（FB-024）+ 内卫府校尉，宗师知动则触朝纲退；掌门失宗师倚仗。
      - 宗师"你借朝力"；肖凡"朝力亦力，江湖门派亦受籍束"；校尉"国师令在此"。
    turn: 高潮
    exit_state: 大爽（制度碾压·破宗门靠山）。
    environment_function: 籍纸朱印鲜；校尉腰牌冷光；宗师衣袂罡气微荡却止步；令旗朱红展风。
    technique:
      dominant: limited_pov_filter
      supporting:
        - action_causality
        - spatial_clarity
      rhythm: 中
      sensory_focus: 籍纸朱印鲜；校尉腰牌冷光；宗师衣袂罡气微荡却止步；令旗朱红展风。
      information_method: 宗师"你借朝力"；肖凡"朝力亦力，江湖门派亦受籍束"；校尉"国师令在此"。
      rationale: 贴合本章基调与红线
    red_line_refs: []
  - id: beat-5
    type: action
    purpose: 洗牌成（约450字）
    location: 围剿溃，洗牌令成。
    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 大宗门掌门见三碾压无解，率派退避认籍；肖凡颁"江湖洗牌令"定局（FB-061 成），青溪等小派附议，格局重定。
    turn: 收束
    exit_state: 大爽（卷终收束·格局重定）。
    environment_function: 掌门背汗透皂衫；令纸黄麻朱印落；台下江湖头面颔首；雪落檐静。
    technique:
      dominant: action_causality
      supporting:
        - spatial_clarity
        - environmental_pressure
      rhythm: 中
      sensory_focus: 掌门背汗透皂衫；令纸黄麻朱印落；台下江湖头面颔首；雪落檐静。
      information_method: 动作呈现
      rationale: 贴合本章基调与红线
    red_line_refs: []
  - id: beat-6
    type: action
    purpose: 卷三终（约450字）
    location: 肖凡立台，望江湖。
    participants:
      - 肖凡
      - 三皇子
    entry_condition: 承接上节拍/前序关联
    beats:
      - 肖凡明"江湖声望鹊起、新贵定鼎（FB-060 呼应），三碾压立"；收束卷三，钩卷四国战（FB-062：听雨全面/三皇子余党/虞国伏线）。末句定调。
    turn: 收束钩
    exit_state: 卷终收束+钩子。
    environment_function: 册页满折痕记洗牌；灯花爆；雪光映窗；他指节扣，唇角微扬。
    technique:
      dominant: spatial_clarity
      supporting:
