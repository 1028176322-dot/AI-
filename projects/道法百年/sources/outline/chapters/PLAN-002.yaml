plan:
  id: PLAN-002
  chapter_id: CH-002
  number: 2
  volume_id: VOL-001
  arc_id: ARC-001
  status: approved_for_writing
  role: setup
  word_budget: 2800
starting_state:
  time: 永熙三年至八年(1370–1375年)·肖凡0–5岁
  location: 1370–1375，清虚观院落，四季更替。
  protagonist_state: 永熙三年至八年(1370–1375年)·肖凡0–5岁；肖凡主线推进中
  reader_knows: 读者已知前情与既有伏笔（见前序关联）
  reader_does_not_know: 本章将揭示/推进的未知走向
objectives:
  plot: 五年成长，肖凡从婴儿长到五岁。通过偷听师兄对话、翻藏书阁，拼出世界轮廓：大晟王朝、太祖萧氏、都盛京、帝肃宗萧咤、年号永熙。四师兄性格展现（陈守沉稳、林谋机灵、周猛力大、宋明书痴）。肖凡收到玉佩，觉与前世所购一模一样。
  character: 角色成长：陈守、林谋、周猛、宋明
  reader: 读者获得本章事件推进与情绪/信息收益
  arc_progress: 推进所在幕(ARC-001)/卷(VOL-001)叙事
conflict:
  desire: 主角意欲推进之事（见摘要）
  opposition: 阻力/反方（见摘要与设定）
  stakes: 成败利害（见设定与余波）
  dilemma: 两难取舍（见撰写备注）
  escalation: 冲突升级路径（见节拍分解）
scenes:
  - id: beat-1
    type: transition
    purpose: 五年掠影（约450字）
    location: 1370–1375，清虚观院落，四季更替。
    participants:
      - 肖凡
    entry_condition: 本章开场
    beats:
      - 用身体变化带出成长——肖凡从爬行到蹒跚到奔跑；春去秋来扫落叶、冬日生火盆。
    turn: 开场
    exit_state: 本章节拍收束
    environment_function: （感官细节见细节锚点）
    technique:
      dominant: controlled_ellipsis
      supporting:
        - temporal_compression
        - scene_counterpoint
      rhythm: 中
      sensory_focus: 具体感官
      information_method: 动作呈现
      rationale: 贴合本章基调与红线
    red_line_refs:
      - R11
      - R15
      - R12
  - id: beat-2
    type: action
    purpose: 偷听师兄（约450字）
    location: 某日厢房外，肖凡蹲墙根偷听四师兄闲话。
    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 陈守沉稳安排杂务、林谋机灵出主意、周猛憨直应下力气活、宋明埋首书卷插不上话。四人性情通过对话自然流露。
      - 林谋"师父那套规矩，得绕着走"；周猛"听大哥的"；陈守"莫惹师父生气"。
    turn: 发展
    exit_state: 本章节拍收束
    environment_function: （感官细节见细节锚点）
    technique:
      dominant: environmental_pressure
      supporting:
        - action_causality
        - spatial_clarity
      rhythm: 中
      sensory_focus: 具体感官
      information_method: 林谋"师父那套规矩，得绕着走"；周猛"听大哥的"；陈守"莫惹师父生气"。
      rationale: 贴合本章基调与红线
    red_line_refs:
      - R18
      - R12
  - id: beat-3
    type: revelation
    purpose: 翻藏书阁（约450字）
    location: 藏书阁，肖凡趁宋明不在翻《大晟疆域志》《朝野杂记》。
    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 拼出世界轮廓——大晟太祖萧氏立国、都盛京、今帝肃宗萧咤、年号永熙。以孩童视角记关键名词。
    turn: 转折
    exit_state: 本章节拍收束
    environment_function: 书页霉味混檀香；指腹划过"盛京"二字；窗外蝉鸣衬静。
    technique:
      dominant: fair_clue_placement
      supporting:
        - contrast_reveal
        - delayed_naming
      rhythm: 中
      sensory_focus: 书页霉味混檀香；指腹划过"盛京"二字；窗外蝉鸣衬静。
      information_method: 动作呈现
      rationale: 贴合本章基调与红线
    red_line_refs:
      - R12
      - R14
  - id: beat-4
    type: transition
    purpose: 收玉佩（约450字）
    location: 五岁生辰，无为子将玉佩正式交肖凡。
    participants:
      - 肖凡
      - 无为子
    entry_condition: 承接上节拍/前序关联
    beats:
      - 肖凡接玉，触感温润，心中一震——与前世古玩摊所购玉佩一模一样（FB-001 深化）。不动声色收起。
      - 无为子"此物随你而来，便归你"；肖凡只点头。
    turn: 收尾
    exit_state: 本章节拍收束
    environment_function: （感官细节见细节锚点）
    technique:
      dominant: symbolic_echo
      supporting:
        - temporal_compression
        - controlled_ellipsis
      rhythm: 中
      sensory_focus: 具体感官
      information_method: 无为子"此物随你而来，便归你"；肖凡只点头。
      rationale: 贴合本章基调与红线
    red_line_refs:
      - R17
      - R14
  - id: beat-5
    type: action
    purpose: 对比（约300字）
    location: 夜，肖凡握玉自思。
    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 以现代记忆对比此世（无火药、冷兵器、王朝礼制），暗记差异。
    turn: 闲笔
    exit_state: 本章节拍收束
    environment_function: （感官细节见细节锚点）
    technique:
      dominant: action_causality
      supporting:
        - spatial_clarity
        - environmental_pressure
      rhythm: 中
      sensory_focus: 具体感官
      information_method: 动作呈现
      rationale: 贴合本章基调与红线
    red_line_refs:
      - R20
      - R17
