  dilemma: 两难取舍（见撰写备注）
  escalation: 冲突升级路径（见节拍分解）
scenes:
  - id: beat-1
    type: transition
    purpose: 宗师再压（约450字）
    location: 永熙二十八年，北境边墙，虞国宗师率精锐再压。
    participants:
      - 肖凡
    entry_condition: 本章开场
    beats:
      - 虞国宗师（金身+化罡）纵罡气荡尘逼墙，边军退；肖凡登烽燧据高，老柯递狙枪（FB-065）。
    turn: 开场
    exit_state: 大高潮前奏。
    environment_function: （感官细节见细节锚点）
    technique:
      dominant: controlled_ellipsis
