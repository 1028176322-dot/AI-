      information_method: 动作呈现
      rationale: 贴合本章基调与红线
    red_line_refs: []
  - id: beat-2
    type: action
    purpose: 据高待击（约450字）
    location: 肖凡据烽燧校准。
    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 肖凡托狙枪，校表尺对应宗师三百步距，引灵气稳息（非破宗师，仅稳手）；无烟火药弹上膛。
    turn: 发展
    exit_state: 小爽（工艺感）。
    environment_function: 表尺铜刻细；风过枪管凉；他吐纳深稳；弹入膛顺滑。
    technique:
      dominant: environmental_pressure
      supporting:
        - action_causality
        - spatial_clarity
      rhythm: 中
      sensory_focus: 表尺铜刻细；风过枪管凉；他吐纳深稳；弹入膛顺滑。
      information_method: 动作呈现
      rationale: 贴合本章基调与红线
    red_line_refs: []
  - id: beat-3
    type: revelation
    purpose: 一击破罡（约450字）
    location: 肖凡击发。
    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 肖凡无烟火药弹击宗师护体罡气要害——高初速线膛弹破罡穿金身，宗师陨。FB-065 成（实战破宗师）；FB-042 方解。
      - 肖凡"无烟一击，罡气无所遁"；边军"宗师……陨了"。
    turn: 转折
    exit_state: 大爽（科技破宗师·碾压）。
    environment_function: 硝烟淡如灰；弹着罡气裂如潮退；宗师金身洞穿血溅雪泥；枪管余温烫手。
    technique:
      dominant: fair_clue_placement
      supporting:
        - contrast_reveal
        - delayed_naming
      rhythm: 中
      sensory_focus: 硝烟淡如灰；弹着罡气裂如潮退；宗师金身洞穿血溅雪泥；枪管余温烫手。
      information_method: 肖凡"无烟一击，罡气无所遁"；边军"宗师……陨了"。
      rationale: 贴合本章基调与红线
    red_line_refs: []
  - id: beat-4
    type: action
    purpose: 余震（约450字）
    location: 宗师陨，虞军骇。
    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 虞国精锐见宗师陨，阵脚大乱；肖凡不追，收枪立烽燧——一击定局。
    turn: 高潮
    exit_state: 大爽（战场支配）。
    environment_function: 精锐背汗透甲；旌旗红影乱；烽燧影长；他唇角微扬。
    technique:
      dominant: limited_pov_filter
      supporting:
        - action_causality
        - spatial_clarity
      rhythm: 中
      sensory_focus: 精锐背汗透甲；旌旗红影乱；烽燧影长；他唇角微扬。
      information_method: 动作呈现
      rationale: 贴合本章基调与红线
    red_line_refs: []
  - id: beat-5
    type: action
    purpose: 方解（约450字）
    location: 肖凡验。
    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 肖凡验狙枪破宗师，明"FB-042 卷四方解（R4/R6），非修炼破乃科技破"。章末钩子：师，破了。
    turn: 收束
    exit_state: 大爽（收束）。
    environment_function: 册页添破宗师记；灯花爆；营风静。
    technique:
      dominant: action_causality
      supporting:
        - spatial_clarity
        - environmental_pressure
      rhythm: 中
      sensory_focus: 册页添破宗师记；灯花爆；营风静。
      information_method: 动作呈现
      rationale: 贴合本章基调与红线
    red_line_refs: []
  - id: beat-6
    type: action
    purpose: 收束钩（约450字）**（约450字）
    location: 肖凡立烽燧。
    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 肖凡思"狙枪破宗师即以技破武·国战（FB-068）声威基"；钩幕四听雨主力决战（FB-073/FB-074 属幕四，仅钩）。暗联 FB-068/072。
    turn: 收束钩（约450字）**
    exit_state: 收束+钩子。
    environment_function: 功法篇角旧；边月映帐；他指节扣。
    technique:
      dominant: spatial_clarity
      supporting:
        - action_causality
        - environmental_pressure
      rhythm: 中
      sensory_focus: 功法篇角旧；边月映帐；他指节扣。
