objectives:
  plot: 虞国宗师再压边墙，肖凡以狙击枪（无烟火药+线膛+瞄具）于要害一击破其护体罡气，宗师陨。科技破宗师大爽点，R1/R4/R5/R19 严守，解 FB-042（卷四方解 R4/R6）。FB-065 成（实战破宗师）；FB-042 推进（方解）。
  character: 角色成长：肖凡、老柯、虞国宗师
