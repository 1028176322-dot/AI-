scenes:
  - id: beat-1
    type: transition
    purpose: 凯旋入城（约450字）
    location: 永熙二十九年春，北境镇城西门，边军凯旋。
    participants:
      - 肖凡
    entry_condition: 本章开场
    beats:
      - 肖凡随边军主力入城，老柯押运无烟火药弹药车在后；城头残雪未消，旌旗半卷。
      - 边将"此役破听雨主力，先生居首功"；肖凡"首功在军籍与将士，非一人"。
    turn: 开场
    exit_state: 小爽（凯旋定调）。
    environment_function: （感官细节见细节锚点）
    technique:
      dominant: controlled_ellipsis
      supporting:
        - temporal_compression
        - scene_counterpoint
      rhythm: 中
      sensory_focus: 具体感官
      information_method: 边将"此役破听雨主力，先生居首功"；肖凡"首功在军籍与将士，非一人"。
      rationale: 贴合本章基调与红线
    red_line_refs: []
  - id: beat-2
    type: action
    purpose: 收束点卯（约450字）
    location: 镇城帅府，点卯收编。
    participants:
      - 肖凡
      - 苏墨凝
    entry_condition: 承接上节拍/前序关联
    beats:
      - 肖凡以军籍簿（FB-078 推进）核边军功籍，无烟火药狙击枪战例入档；苏墨凝呈北境谍报。
    turn: 发展
    exit_state: 小爽（制度落地）。
    environment_function: 军籍黄册朱批密；炉上铜壶水汽白；苏指尖点北境图。
    technique:
      dominant: environmental_pressure
      supporting:
        - action_causality
        - spatial_clarity
      rhythm: 中
      sensory_focus: 军籍黄册朱批密；炉上铜壶水汽白；苏指尖点北境图。
      information_method: 动作呈现
      rationale: 贴合本章基调与红线
    red_line_refs: []
  - id: beat-3
    type: revelation
    purpose: 声望起（约450字）
