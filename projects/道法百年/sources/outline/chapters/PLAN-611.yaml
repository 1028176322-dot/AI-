      - 肖凡"宗师亦毙于狙枪，武者当知技之界"；老卒骇然。
    turn: 转折
    exit_state: 中爽（技破武声望）。
    environment_function: 枪管泛青霜；营中号衣汗碱白圈；风卷旗响。
    technique:
      dominant: fair_clue_placement
      supporting:
        - contrast_reveal
        - delayed_naming
      rhythm: 中
      sensory_focus: 枪管泛青霜；营中号衣汗碱白圈；风卷旗响。
      information_method: 肖凡"宗师亦毙于狙枪，武者当知技之界"；老卒骇然。
