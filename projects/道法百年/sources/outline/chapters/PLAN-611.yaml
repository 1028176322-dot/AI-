objectives:
  plot: 国战前线收束，肖凡随边军凯旋入北境镇城，以"狙击枪破宗师+灵气火器+军籍体制"多碾压奠定国战收束基调。空间锚点固（R11），技破武声望定盘（FB-068 推进）。FB-074 收束启动。
  character: 角色成长：肖凡、老柯、边军将领、苏墨凝
