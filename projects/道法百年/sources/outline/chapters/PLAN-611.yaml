    entry_condition: 承接上节拍/前序关联
    beats:
      - 肖凡望北境荒原，明"国战收束，格局重定"；章末钩子：战，收了。
    turn: 收尾
    exit_state: 小爽（收束）。
    environment_function: 城堞苔痕冻；远山雪线低；他唇角微扬。
    technique:
      dominant: symbolic_echo
      supporting:
        - temporal_compression
        - controlled_ellipsis
      rhythm: 中
      sensory_focus: 城堞苔痕冻；远山雪线低；他唇角微扬。
      information_method: 动作呈现
      rationale: 贴合本章基调与红线
    red_line_refs: []
