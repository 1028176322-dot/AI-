objectives:
  plot: 国师玄尘子颁国战令，内卫府（FB-077）奉令护肖凡军籍与暗线，开赴北境。战争班底（FB-076）随行成型：军械（老柯/莫铁）、参谋（文仲）、斥候（窦九/钱小乙/陆九）、边军联络（小满/铁牛）。FB-077 推进，FB-076 起。R17 布局。
  character: 角色成长：肖凡、玄尘子、卫长风、老柯/莫铁
  reader: 读者获得本章事件推进与情绪/信息收益
  arc_progress: 推进所在幕(ARC-024)/卷(VOL-004)叙事
