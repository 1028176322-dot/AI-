    type: action
    purpose: 头目钩（约450字）**（约450字）
    location: 西津渡暗舱。
    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 顾潮生（新角色，江南听雨使）听线报"肖凡似有所觉"，冷笑"江湖非京师，慢慢织"。暗联 FB-057 反方。
      - 顾"京师丢了，江南补回"；手下"好物商城防得紧"。
