  dilemma: 两难取舍（见撰写备注）
  escalation: 冲突升级路径（见节拍分解）
scenes:
  - id: beat-1
    type: transition
    purpose: 渡口（约450字）
    location: 南州·西津渡，晨雾未散，货船卸粮。
    participants:
      - 肖凡
    entry_condition: 本章开场
    beats:
      - 肖凡立码头石阶看漕船，陆九（FB-063 南州探）低报"有南音客连三日问好物商城工坊"。
      - 陆九"那客袖口绣水纹，话里套火器"；肖凡"记着，不惊他"。
    turn: 开场
    exit_state: 本章节拍收束
    environment_function: （感官细节见细节锚点）
    technique:
      dominant: controlled_ellipsis
