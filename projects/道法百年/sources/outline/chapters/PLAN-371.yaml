    type: action
    purpose: 暗联（约450字）**（约450字）
    location: 肖凡翻册。
    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 肖凡联 FB-012/025/047/057，定"以江湖台对江湖网"。暗联。
