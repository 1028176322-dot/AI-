      rhythm: 中
      sensory_focus: 具体感官
      information_method: 陆九"那客袖口绣水纹，话里套火器"；肖凡"记着，不惊他"。
      rationale: 贴合本章基调与红线
    red_line_refs: []
  - id: beat-2
    type: action
    purpose: 识纹（约450字）
    location: 好物商城南州分号二楼。
    participants:
      - 肖凡
      - 苏墨凝
    entry_condition: 承接上节拍/前序关联
    beats:
      - 苏墨凝（FB-023）呈西津渡接线录，肖凡认出同京中听雨暗纹（FB-012 同脉）——确为听雨江湖网（FB-057）。
      - 苏"纹路与京师南货行一般无二"；肖凡"京中净了，他们下江湖"。
    turn: 发展
    exit_state: 本章节拍收束
    environment_function: （感官细节见细节锚点）
