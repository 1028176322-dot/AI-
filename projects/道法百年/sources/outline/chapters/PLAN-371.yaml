objectives:
  plot: 听雨阁京中净后转江湖网，肖凡于南州西津渡初触其江湖暗桩（FB-057 交锋启）。肖凡以情报台（FB-025）反制，不撕破脸、只记线。江湖智斗小爽点，R17 布局者不莽。
  character: 角色成长：肖凡、苏墨凝
  reader: 读者获得本章事件推进与情绪/信息收益
  arc_progress: 推进所在幕(ARC-015)/卷(VOL-003)叙事
