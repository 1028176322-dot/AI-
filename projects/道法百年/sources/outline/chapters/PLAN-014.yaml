objectives:
  plot: 肖凡随师兄下山办差，归途遇山贼拦路抢劫。师兄被缠，肖凡暗中用火绳枪震慑（近距一枪放倒领头，铜骨级防御硬接一刀无碍），山贼骇散。肖凡不欲张扬，借口「暗中高人相助」糊弄师兄。小打脸爽点。
  character: 角色成长：肖凡、周猛/林谋(随)、山贼头目(首次)
  reader: 读者获得本章事件推进与情绪/信息收益
  arc_progress: 推进所在幕(ARC-001)/卷(VOL-001)叙事
