  - id: beat-2
    type: action
    purpose: 师兄被缠（约450字）
    location: 对峙。
    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 两山贼缠住周猛，头目逼近肖凡夺货；肖凡佯慌退，袖中火绳枪暗握。头目不以为意（小孩罢了）。
      - 头目"小道士，货留下"；周猛"休想"。
    turn: 发展
    exit_state: 本章节拍收束
    environment_function: （感官细节见细节锚点）
    technique:
      dominant: environmental_pressure
      supporting:
        - action_causality
        - spatial_clarity
      rhythm: 中
      sensory_focus: 具体感官
      information_method: 头目"小道士，货留下"；周猛"休想"。
      rationale: 贴合本章基调与红线
    red_line_refs:
      - R18
      - R17
  - id: beat-3
    type: revelation
    purpose: 双碾压（约450字）
    location: 肖凡近身骤发。
    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 肖凡借林木遮掩，火绳枪抵近轰头目胸口——铁皮级中弹倒地（R4 演示）；另贼刀砍肖凡，他铜骨硬接，刃卷无伤。山贼骇散。
    turn: 转折
    exit_state: 本章节拍收束
    environment_function: 枪响震落叶；头目胸前血洞涌黑红；刀砍臂只留白印。
    technique:
      dominant: fair_clue_placement
      supporting:
        - contrast_reveal
        - delayed_naming
      rhythm: 中
      sensory_focus: 枪响震落叶；头目胸前血洞涌黑红；刀砍臂只留白印。
      information_method: 动作呈现
      rationale: 贴合本章基调与红线
    red_line_refs:
      - R4
      - R12
      - R6
  - id: beat-4
    type: transition
    purpose: 糊弄（约400字）
    location: 师兄惊问。
    participants:
      - 肖凡
    entry_condition: 承接上节拍/前序关联
    beats:
      - 肖凡伪称"幸有路过高人暗助"，指远处山坳糊弄。师兄信疑参半，只当遇贵人。肖凡暗收枪，不露。
    turn: 收尾
    exit_state: 第一战，赢了，且没人知道是他。
    environment_function: （感官细节见细节锚点）
    technique:
