project:
  id: novel-dsf
  name: 道士也玩火力覆盖
  type: xuanhuan
  status: active

# ─────────────────────────────────────────────────────────────
# 版本约束（非路径）：Platform 实际位置由上层 workspace.yaml 解析，
# 本项目不写死任何绝对路径，换设备 / 换盘符均不失效。
# 启动第一件事 = 兼容性检查（bootstrap / doctor），不满足 requires 立即退出。
# ─────────────────────────────────────────────────────────────
requires:
  platform: ">=2.1.0"        # registry/versions.yaml → core.platform
  nkb_schema: ">=1.2.0"      # NKB/*.yaml → schema_version
  contracts: ">=1.1.0"       # registry/versions.yaml → core.contract
  templates:
    xuanhuan: ">=1.3.0"      # templates/xuanhuan → profile.yaml schema_version

template:
  id: xuanhuan
  version: 1.3.0

plugins:
  planner: planner.default@1.2.0
  context: context.runtime@2.0.0
  workflow: workflow.novel@1.4.0
  review: review.four-pillars@4.3.0

capabilities:
  narrative: capability.narrative.default@2.0.0
  character: capability.character.default@1.5.0
  dialogue: capability.dialogue.ancient@1.3.0
  battle: capability.battle.xuanhuan@2.1.0
  emotion: capability.emotion.commercial@1.2.0
  description: capability.description.ancient@1.1.0

# 以下路径均相对本项目根（可移植）
paths:
  nkb: ./NKB
  outline: ./大纲_1000章总体规划.md
  chapters: ./txt
  artifacts: ./artifacts
  overrides: ./overrides
  memory: ./memory/project

gates:
  editor_score: 80
  consistency_index: 0.95
  reader_index: 60
  payment_intent: 60
  max_loop: 5

# ─────────────────────────────────────────────────────────────
# 任务系统强制层（Task Enforcement）：把任务系统从"建议流程"升级为
# "唯一合法执行通道"。详见 platform/.../core/policies/task-enforcement.policy.yaml
#   enabled          : 是否启用任务系统
#   enforcement_mode : off / warn / strict。当前 strict = 无 Task ID 不执行
#   direct_file_write: false = 禁止通用 Write/Edit 直改项目内容产物
#   task_required_for: 以下动作类型必须先有合法 task_id
#   completion_authority: 仅这些角色可标记任务 COMPLETED（执行者不可自验）
#   workspace_only_write: 产物先落 tasks/<status>/<id>/outputs/，Gate 后移入正式目录
# ─────────────────────────────────────────────────────────────
task_system:
  enabled: true
  enforcement_mode: strict
  direct_file_write: false
  task_required_for: [create, modify, delete, review, publish, nkb_update]
  completion_authority: [orchestrator, gate]
  workspace_only_write: true

# ─────────────────────────────────────────────────────────────
# 单 Agent 执行策略（Single-Agent Execution）：把"禁止子 Agent"从提示词偏好
# 升级为平台级执行策略。详见 platform/.../core/policies/agent-execution.policy.yaml
#   agent_mode               : single = 强制单 Agent 顺序执行（显式，不继承模糊默认）
#   concurrency              : 最多 1 活跃 Agent / 1 RUNNING 任务 / 1 并行工具调用 / 0 后台作业
#   delegation/subagents     : 任务委派 / 子 Agent 创建 全部禁用
#   background/async_tasks/worker_pool/fork: 后台与并行执行单元全部禁用
#   decomposition            : 允许步骤拆解，禁止 Agent 拆解
#   role_switching           : 角色切换通过 context_package 实现（同一 Agent 内）
#   violation_policy         : 任何子 Agent/委派/并行触发即 block，并改写为串行计划
#   本段为项目级显式声明，普通 Agent 不得覆盖；agent_modes 仅 single_safe 可选。
# ─────────────────────────────────────────────────────────────
runtime:
  agent_mode: single
  agent_modes:
    active: single_safe
    selectable: [single_safe, multi_agent]
  concurrency:
    max_active_agents: 1
    max_running_tasks: 1
    max_parallel_tool_calls: 1
    max_background_jobs: 0
  delegation:
    enabled: false
  subagents:
    enabled: false
  background:
    enabled: false
    max_jobs: 0
  async_tasks:
    enabled: false
  worker_pool:
    size: 0
  fork:
    enabled: false
  decomposition:
    step_decomposition: true
    agent_decomposition: false
  role_switching:
    enabled: true
    method: context_package
  violation_policy:
    on_subagent_spawn: block
    on_delegation: block
    on_parallel_execution: block
    recovery: convert_to_sequential
