data_quality_notes:
  - source_id: qingyuniandu
    issue: 标题行以全角空格缩进，标准化副本已规整为行首『第X章』、楔子→第零章、卷标行丢弃，746 章有效。
    impact: 章级指标有效。
  - source_id: zhuixu
    issue: 844 章 + 1 楔子（楔子内容并入首章前导，不单独计章）。
    impact: 全部指标可采信。
  - source_id: yanyulou
    issue: GB18030→UTF-8 标准化，楔子→第零章，1980 章 + 第零章=1981 章标记有效。
    impact: 全部指标可采信。
  - source_id: tangyin
    issue: GB18030→UTF-8 标准化；2397 章标记有效；原文本每章存在『第X章(本章免费)』括号后缀重复标记，规范化时保留其缩进（不输出行首）避免误切。
    impact: 全部指标可采信，无伪分章。
  - source_id: gueryuan
    issue: GB18030→UTF-8 标准化；1081 章（『第X章 标题』形式）去缩进到行首有效。
    impact: 全部指标可采信。
  - source_id: zhenbei
    issue: GB18030→UTF-8 标准化；1776 章（『第X章 标题』形式）去缩进到行首有效。
    impact: 全部指标可采信。
  - source_id: _pipeline
    issue: batch() 的 _safe_id 对中文文件名全部剥离成空串，多源碰撞为同一 source_id 触发 source_count 1<n；本次改用显式 ASCII source_id 绕过，未改动平台代码。
    impact: 6 源独立身份正确，候选可生成。
