exceptions:
  - "txt/: 滞后导出稿(.txt)，与 md 权威源存在 SyncGov 债 #223 漂移；登记为例外，不参与严格布局统计，待平台升级稳定后由 SyncGov 重生成。"
  - "chapters/drafts/: 存放未过平台最新版审核的 6 卷工作稿；待平台升级后走正式审核再升 chapters/approved/。"
  - ".workbuddy/: 平台/agent 项目级技能与状态存储目录（基础设施），非用户内容，登记为例外。"
note: 本项目由 legacy 状态按新立项严格流程原地迁移生成；既有 19KB AGENTS.md 为项目治理索引，保留未覆盖。
