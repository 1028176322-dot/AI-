  - id: CANON-NO-MELODRAMA-ROMANCE-001
    statement: 不写狗血、琼瑶式感情线——无三角虐恋、无突兀的恋爱救赎、无“为爱降智”；如存在情感关系，须克制、真实，并服务于人物刻画与主线推进，不得喧宾夺主。
    severity: major
