  - id: CHAR-JINGSHI-ELDER-001
    canonical_name: 景氏长老（草案·待定名）
    status: 景氏家族长老 / 景奕辰叔父辈，老牌心腹，握体制内底牌
    identity:
      current_age: 62
      role: 景氏家族代表 / 终极底牌持有者
      origin: 京城
    background: 景奕辰父辈的兄弟或发小，景氏发家元老；掌握景奕辰不便直接持有的体制内关系与"致命把柄"，是景氏最后屏障。因资历对景奕辰既有倚仗也有制约，并带基于实力的理性傲慢。具体底牌内容待用户定。
    personality:
