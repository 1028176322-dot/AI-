  - id: STORY-CORE-001
    premise: 大型集团公子陆峥因连续奸杀多名女子被判处死刑缓期二年执行。主角与陆峥长相高度相似，被陆峥之父陆敬山主导构陷顶罪入狱，家人亦遭灭门、家破人亡。陆家看似是幕后黑手，实则是景奕辰的"钱袋子"——替身计划与临江司法舞弊网，真正操盘者是那位隐于幕后的景奕辰。主角在狱中从无助绝望，到向各路囚犯中的人才习得格斗、反侦察、识人、技艺，渐成狠厉；趁一次监狱暴动越狱，一路逃亡至边境，经走私偷渡进入美国。他在异国从底层谋生，逐步建立属于自己的商业、情报与武装三支柱势力根基。前期他扳倒陆家、洗清冤屈、揭开临江黑幕，却在清算中察觉陆家之上另有景氏财团；他未以真实身份归国，而是借在美根基隐于幕后，以势力为刃从暗处继续追查。中期景奕辰浮现；后期他方亮出真实身份，以三支柱为刃与景奕辰展开商业、情报与武力的全方面交战，最终将其扳倒。
    theme: 被剥夺一切的人，绝境反铸其刃；对手的层级越高，刃越要一寸寸磨硬——从地方资本到景氏财团。清白在扳倒陆家时已然夺回；真正的复仇，是扳倒隐于幕后的景奕辰，为惨死家人讨还公道。
    central_conflict: 个体对抗的敌人逐级上抬：前期是地方资本陆家与临江司法舞弊网（此时洗清冤屈）；中期揭开其上的景奕辰；后期以自建商业、情报与武装三支柱，与最终反派展开全方面交战。
    story_promise: 读者跟随一个蒙冤的替罪羊，看他从牢笼里长出獠牙，在异国从零建立起商业、情报与武装三支柱势力；前期扳倒陆家、洗清冤屈，却惊觉幕后另有景氏财团——他不亮真身，借美国身份隐于幕后继续经营势力；中期锁定景奕辰，后期亮出真实身份、以三支柱为刃与之展开全方面交战；每一步都踩在真实的人性、制度与国境缝隙上，每次翻盘来自隐忍、算计与势力经营，而非运气。
    ending_direction: 前期清算陆家、洗清冤屈、揭开临江黑幕，却察觉幕后另有景氏财团；中期以美国身份隐于幕后归国、锁定景奕辰；后期亮出真实身份、以三支柱全面交战，最终扳倒景奕辰、为家人讨还，但代价不可逆（亲人已逝、自身已异于当年那个陆野）。第一卷止于越狱成功、踏上边境偷渡之路。
    state: designed
