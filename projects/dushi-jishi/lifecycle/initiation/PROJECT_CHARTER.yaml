project:
  id: novel-dushijishi
  working_title: 替罪入狱后，我成了海外大佬
  project_type: novel
  status: active
  genre: 都市(dushi)
concept:
  one_sentence_premise: 与死囚陆峥长相酷似的山村青年陆野被其家族构陷顶罪入狱、家破人亡，他在狱中长出血肉獠牙，越狱偷渡赴美从零建起商业、情报与武装三支柱，借"美国身份"隐于幕后归国，逐级扳倒地方资本陆家与隐于幕后的景氏财团，为惨死家人讨还公道。
  central_question: 一个被剥夺一切的人，如何借绝境反铸其刃，在真实的人性、制度与国境缝隙里一寸寸磨硬刀锋，扳倒层层叠叠的幕后黑手？
goals:
  length_target: 1000+
  serialization: true
scope:
  included:
    - 都市现实质感与阶层对抗
    - 跨国势力经营（商业/情报/武装三支柱）
    - 蒙冤复仇与爽点节奏并重的男频叙事
    - 地方资本到财团的逐级敌人上抬结构
  excluded:
    - 校园场景与学生恋爱线
    - 超自然与玄幻元素
    - 狗血三角恋与为爱降智
    - 为虐而虐、长期剥夺主角能动性
success_criteria:
  creative: 强读者黏性、清晰的长期爽点节奏、都市现实质感并重
  structural: 千章以上可扩展、卷纲与章节详细计划完备
  operational: 通过 strict 治理校验、单 Agent 执行链路稳定
