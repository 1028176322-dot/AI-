    faction:
      id: faction-beijing-top-001
      canonical_name: 景氏财团
      type: 隐于幕后的顶级权贵资本集团
      status: 幕后操盘，中期逐渐浮出水面
      goals:
        - 维系顶层权力与资本垄断
        - 通过陆家等白手套洗白与扩张
        - 清除一切威胁（含主角）
      relationships:
        - 与陆家/鼎丰：主从（钱袋子）
        - 与主角：终极对抗
  rationale: 用户明确：陆家是景奕辰的钱袋子，陆家为前期反派、引出此最终反派。这是全书终极敌对势力。
  basis: 用户指令 + story-core-001（层级上抬至最终反派）
  confidence: 0.85
  authority_class: user_locked
  impact: fatal
  requires_user_decision: true
  dependencies:
