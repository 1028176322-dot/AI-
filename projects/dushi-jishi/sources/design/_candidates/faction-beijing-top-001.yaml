  originality:
    reference_methods_only: true
    copied_expression: false
    copied_proper_nouns: []
  writing_reference:
    source: learning/ref-xiedi-antagonist-faction.md
    note: 仅作"反派势力怎么立"的写法参考，非设定事实；势力名已定为景氏财团、核心人物已定为景奕辰，底牌内容仍由用户决策。
    applicable_techniques:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
    guidance:
      - 层级遮蔽(技法1)：前期只写前台代理(陆家/鼎丰)嚣张，顶级势力仅通过资源流/指令间接显现，中期才浮出。
      - 遥制指挥链(技法2)：呈现'京城核心决策圈→执行代理(陆家)→行动组'的层级，主角攻破时顺藤摸瓜。
      - 复合体(技法3)：展示其资本控制+私武装+情报网如何互为表里(反派镜像版三支柱)。
      - 投送掣肘(技法4)：设定'体量碾压却不能公开全力'的体制/政治掣肘，解释主角能存活到后期。
      - 战略威慑(技法5)：握有体制内致命底牌/顶层把柄，使对决是僵持而非秒杀，解释'全面交战'层级。
      - 脆弱维度(技法6)：构建时就预埋可被攻破的缝隙(派系不齐心/信息轻视/经济命门/核心可斩首)，供后期主角三支柱针对。
