    character:
      id: char-protagonist-001
      canonical_name: 陆野
      status: 主角（在场、主动）
      identity:
        current_age: 22
        role: 刚毕业的山村青年、城市新移民
        origin: 大山深处村落，自幼随父进山打猎；靠苦读考入临江的大学，刚毕业留城谋生，旋即遭鼎丰构陷顶罪
      background: 毕业后经同乡介绍进入鼎丰关联的高端会所担任保安；某次值班与来消遣的陆峥正面相遇，因长相酷似被陆家盯上。陆敬山为救死缓儿子启动替身计划，借主角值班之机伪造其"在场证据"与"作案嫌疑"，使其在陆峥所涉系列案中被定性为真凶、锒铛入狱；其家人随后遭集团灭口。
      personality:
        stable_traits:
          - 隐忍
          - 观察力极强（狩猎本能）
          - 重情
          - 适应力极强
        values:
          - 清白
          - 家人
        forbidden_behaviors:
          - 欺凌无辜
          - 背信弃义
      goal: 洗清冤屈、查明构陷真相与幕后主使、为惨死家人复仇
      identity_strategy:
        - 前期扳倒陆家时即洗清冤屈、恢复清白之名
        - 清算中察觉陆家之上的景氏财团后，不以真实身份陆野归国
        - 借在美根基（野锋资本 / 观澜 / 夜枭小队）以“美国身份”隐于幕后回国，从暗处继续追查与布局
        - 后期直面景奕辰时，方亮出真实身份陆野，以三支柱为刃全面交战
      abilities:
        - 山野狩猎练就的极强观察力与方向感（自幼随父进山打猎）
        - 极佳的身体素质与耐力（常年爬山狩猎的底子）
        - 极强的学习与适应能力（快速掌握新技能）
        - 狱中习得格斗与反侦察（见 ability-prison-skills-001）
        - 快速识人与模仿
      relationships:
        - 与陆峥：长相相同的死敌与身份替换对象
        - 与陆敬山：不共戴天
        - 与狱中师傅们：师徒兼相互利用
      speech:
        register: 平实克制、话少
        prohibited_patterns:
          - 长篇说教
          - 浮夸炫技
  rationale: 主角人设由用户设定提供（大学刚毕业、从大山走出、自幼随父打猎、蒙冤替罪、家破人亡、狱中蜕变），姓名已定（陆野），年龄暂拟待作者确认。山野狩猎底子解释其观察力、身体素质与学习能力，为其狱中快速习技提供因果；入城第一份工作（鼎丰关联会所保安）与被构陷由头（值班时与陆峥相遇、因长相相似被替身计划选中、伪造证据定性为真凶）已补，闭合全书因果。
