      - 投送掣肘(技法4)：不在场操盘、借代理下手的设定正对应'不能公开全力'，强化其隐蔽与主角活得久的合理性。
      - 战略威慑(技法5)：其'顶层把柄/体制内底牌'是威胁来源，也是主角需集齐对等筹码(海外罪证+资源)方能对抗的根因。
      - 理性傲慢(技法7)：写其基于体量优势的'理性误判/轻视主角'，而非无脑坏；作为可被利用的心理弱点，避免脸谱化。
