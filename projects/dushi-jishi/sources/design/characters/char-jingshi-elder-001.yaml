character:
  id: CHAR-JINGSHI-ELDER-001
  canonical_name: 景氏长老（草案·待定名）
  status: 景氏家族长老 / 景奕辰叔父辈，老牌心腹，握体制内底牌
  identity:
    current_age: 62
    role: 景氏家族代表 / 终极底牌持有者
    origin: 京城
  background: 景奕辰父辈的兄弟或发小，景氏发家的元老；掌握景奕辰不便直接持有的体制内关系与"致命把柄"，是景氏最后的屏障。因资历对景奕辰既有倚仗也有制约，并带有基于实力的理性傲慢（非无脑坏）。具体底牌内容（何种体制内资源/把柄）待用户定。
  personality:
    stable_traits:
      - 深谋
      - 傲慢（基于实力）
      - 家族至上
    values:
      - 景氏家族利益
    forbidden_behaviors:
      - 公开露面
  goal: 维系景氏家族顶层权力，作为景奕辰对决主角的最后壁垒
  abilities:
    - 顶层政治资源
    - 人脉纵深
    - 内部制衡
  relationships:
    - 与景奕辰：家族倚仗与制约并存
    - 与情报主管：并行核心圈
    - 与主角：终极对立（秩序重建的对立面）
  speech:
    register: 居高临下、点到即止
    prohibited_patterns:
      - 露底
