  trump_card: 某实权派系的兼职顾问身份，案发时可压下卷宗/调动关系，是景氏免于被查的最后屏障；其倒台将引发景氏保护链连锁崩塌。
  personality:
    stable_traits:
      - 老练
      - 谨慎
      - 重筹码
    values:
      - 自身安全优先
    forbidden_behaviors:
      - 留下把柄
  goal: 为景氏提供顶层政治庇护
  abilities:
    - 体制内影响力
    - 政策疏通
    - 危机摆平
  relationships:
    - 与景奕辰：庇护关系
    - 与国内地下总负责：提供庇护
    - 与主角：体制内对抗
  speech:
