character:
  id: CHAR-JINGSHI-DOMESTIC-001
  canonical_name: 景氏国内地下总负责·洪涛
  status: 景氏国内地下行动总负责人，老韩的上级
  identity:
    current_age: 50
    role: 景氏国内安全 / 地下网络总负责人
    origin: 京城
  background: 统管景氏在国内的地下行动网络（含清道夫组老韩、打手、地方关系），是景氏"武力支柱"的国内端。作为"核心可被斩首"的关键节点，也是主角可策反 / 斩首的突破口。
  trump_card: 统管全国地下网络（催收/盯梢/灭口/江湖结盟），手下有可被主角策反的中层（埋反水伏笔）；掌握多处安全屋与弹药来源——是主角国内阶段首要斩首目标。
  personality:
    stable_traits:
      - 强硬
      - 务实
      - 重地盘
    values:
      - 景氏指令至上
    forbidden_behaviors:
      - 擅自越权
  goal: 维护景氏国内安全、执行强硬清场
  abilities:
    - 地下网络指挥
    - 暴力执行
    - 危机镇压
  relationships:
    - 与老韩：下属（清道夫组）
    - 与京城大保护伞：受庇护
    - 与景奕辰：直属
    - 与主角夜枭：武力对抗
  speech:
    register: 简短、命令式
    prohibited_patterns:
      - 废话
