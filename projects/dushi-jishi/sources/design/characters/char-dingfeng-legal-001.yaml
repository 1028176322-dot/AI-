    stable_traits:
      - 精明
      - 钻营
      - 风险厌恶
    values:
      - 程序合规即安全
    forbidden_behaviors:
      - 留下书面把柄
  goal: 让构陷在纸面上无懈可击，保陆峥不死
  abilities:
    - 刑诉实务
    - 关系网运作
    - 文书合规化（伪证外衣）
  relationships:
    - 与周慎（COO）：配合伪造证据链
    - 与邵立（保护伞）：司法配合
    - 与陆敬山：汇报
    - 与主角：间接构陷执行层
  speech:
    register: 引经据典、含蓄
    prohibited_patterns:
      - 直说非法
