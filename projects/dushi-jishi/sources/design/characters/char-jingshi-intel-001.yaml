character:
  id: CHAR-JINGSHI-INTEL-001
  canonical_name: 景氏情报主管（草案·待定名）
  status: 景氏情报与反侦察体系主管，主角"观澜"的镜像
  identity:
    current_age: 41
    role: 景氏情报网 / 反侦察负责人
    origin: 京城
  background: 统管景氏的情报搜集、监控主角归国动向、反窃听反追踪；与主角"观澜"形成情报战的对称对抗，是景氏"经济-军事-情报复合体"的情报支柱。其体系内部松散、存在可被渗透的缝隙（对应主角可乘之机）。
  personality:
    stable_traits:
      - 冷静
      - 多疑
      - 技术化
    values:
      - 信息即权力
    forbidden_behaviors:
      - 留下监控痕迹
  goal: 监控威胁、保护景氏机密、反制主角情报网
  abilities:
    - 情报网络
    - 反侦察
    - 技术监控
  relationships:
    - 与景奕辰：直属
    - 与温言：协同调度
    - 与主角观澜：情报战对立
  speech:
    register: 精准、信息密度高
    prohibited_patterns:
      - 情绪化
