character:
  id: CHAR-BEIJING-SCION-001
  canonical_name: 景奕辰
  status: 最终反派（不在场但操盘全局）
  identity:
    current_age: 38
    role: 景氏财团公子爷 / 真正幕后操盘者
    origin: 京城
  background: 陆家是其钱袋子；替身计划与临江司法舞弊网真正的操盘者——为护住己方关键利益（含死缓盟友之子陆峥相关链条），借陆家之手构陷长相相似的主角顶罪。前期隐于幕后，中期随主角追查而逐渐浮出水面。
  personality:
    stable_traits:
      - 城府极深
      - 视人如棋
      - 不容失控
    values:
      - 家族与顶层地位永固
    forbidden_behaviors:
      - 亲自下场暴露
  goal: 维持顶层权力与资本垄断，清除主角与一切隐患，保住盘面不被掀翻
  abilities:
    - 顶层人脉与跨地域资源调度
    - 操纵舆论、审批与司法于无形
    - 多层级白手套运作
  relationships:
    - 与陆家/陆敬山：主从（钱袋子）
    - 与陆峥：利益链条上的被保护方
    - 与主角：终极对抗，前期互不知晓、中期被锁定
  speech:
    register: 温润而疏离、不动声色
    prohibited_patterns:
      - 直白狰狞
