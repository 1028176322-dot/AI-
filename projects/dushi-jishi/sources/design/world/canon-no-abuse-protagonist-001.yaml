rule:
  id: CANON-NO-ABUSE-PROTAGONIST-001
  statement: 不写无意义虐主——主角的苦难须服务于叙事与成长，不得为虐而虐、不得长时间剥夺其主动性与翻盘契机；即便身处绝境，也须保留其观察、谋划与反击的能动性，避免将主角写成纯粹的受难符号。
  severity: major
