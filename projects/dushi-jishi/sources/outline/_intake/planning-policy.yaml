planning_policy:
  schema: outline-governance@2.0.0
  project_id: novel-dushijishi
  total_chapters: 1000
  allowed_chapter_variance: 0
  target_volume_size: 80
  target_arc_size: 20
  detailed_window: 1000
  all_chapters_detailed_required: true
  generation_batch_size: 20
  max_consecutive_transition_chapters: 2
  rolling_refresh:
    enabled: true
    trigger: each_approved_chapter
    refresh_from: approved_chapter_handoff
    preserve_executed_history: true
    minimum_future_detailed_plans: 1000
  generation_authority:
    creative_detail_owner: AI
    user_required_inputs:
      - total_chapters
    high_impact_decisions: follow sources/design/_intake/autonomy-policy.yaml
  created_at: 2026-07-27T22:21:11
