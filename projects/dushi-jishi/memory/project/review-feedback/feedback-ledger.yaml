  - id: FB-6B8CFEF949
    category: hard_consistency
    problem: 第003章中号子里一名瘦高个囚犯点名“姓景的接你出去”，将最终反派景奕辰在第三章即行具名。
    root_cause: 写作时未核对 NKB 实体状态与伏笔时机，把层级远高于陆家、藏在京城的顶层操盘者错误挂到号子诱饵上，既违反 known_by_characters 为空、revealed_to_reader 为 false，也违反 Foreshadow 中期浮现的节奏，且监禁人员逻辑上不可能知晓景。
    writing_guardrail: 写作前核对相关 NKB、时间线和实体状态，正文不得用推测替代事实。
    review_regression_check: 任何角色引用前先核对 Characters.yaml 的 known_by_characters 与 revealed_to_reader，以及 Foreshadow 的浮现时机；景奕辰只能经陆家资金流向在中期浮现，第三章不得点名、不得让其本人或代理人向囚犯放话“接你出去”。
