  - id: FB-ED203131EA
    category: other
    problem: NKB 中陆峥、鼎丰的 fact_status 标 revealed_to_reader 为 false，但第001章陆野已当面见过陆峥、全章讲述鼎丰，语义矛盾。
    root_cause: fact_status 的 revealed_to_reader 语义过宽，实际应为“真实身份或替身真相未揭”，而非“角色不存在或未出场”。
    writing_guardrail: 把问题转成下一次写作前可执行、审查时可复测的检查动作。
    review_regression_check: 重新界定 fact_status 各标记的真实语义，或拆分“已出场/已提及”与“身份真相已揭”两维，避免以后自动校验对正常出场章节误报违规。
