    category: terminology
    problem: 第001章使用“看守所”“所里那夜”等词，而 NKB Organizations 与设定将地点定为“临江第三监狱”，存在看守所与监狱术语混用。
    root_cause: 写作未锁定 Terminology 唯一标准地点名，沿用了惯用口语。
    writing_guardrail: 写作与修订均使用 Terminology 唯一标准名，禁止同义漂移。
    review_regression_check: 统一使用 NKB 标准地点名“临江第三监狱”；若需描写收押前阶段，应显式标注时间线节点，不与已判决后的监狱阶段混淆。
