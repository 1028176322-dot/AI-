schema_version: 1.0.0
generated_by: project_installer
template:
  id: dushi
  # 与 registry/versions.yaml 的 templates.dushi 对齐（当前 1.3.0）
  version: 1.3.0
requires:
  core: ">=2.1.0"
  nkb_schema: "1.3.0"
# 都市能力（battle 在 capability-routing 中明确 disabled，不列入）；
# 具体 plugin 版本由 core/project-manifest.yaml 的 capability_plugin_map 解析
capabilities:
  - narrative
  - character
  - dialogue
  - emotion
  - description
# 题材配置档案（reference 用途，不复制进项目）
profiles:
  planning: planning.yaml
  review: review-thresholds.yaml
  context: profile.yaml
# 题材种子（seed 策略：带 origin 导入项目，作为候选，不直接成为正史）
seeds:
  terminology: terminology-seed.yaml
# 题材特有初始化规划任务（installer 在其标准 TASK-001..009 之后接续）
initial_tasks:
  - project_discovery
  - story_promise
  - worldbuilding
  - character_design
  - outline_design
# 都市特有 NKB 组件（在 schemas/nkb/nkb-manifest.yaml 基础上附加；当前为空，
# 未来如需要行业体系表 Industry 在此追加，init_nkb 会生成对应空结构）
extra_nkb_components: []
