schema_version: 1.0.0
generated_by: project_installer
template:
  id: xuanhuan
  # 与 registry/versions.yaml 的 templates.xuanhuan 对齐（当前 1.3.0）
  version: 1.3.0
requires:
  core: ">=2.1.0"
  nkb_schema: "3.2.0"
# 题材能力（6 引擎）；具体 plugin 版本由 core/project-manifest.yaml 的 capability_plugin_map 解析
capabilities:
  - narrative
  - character
  - dialogue
  - battle
  - emotion
  - description
# 题材配置档案（reference 用途，不复制进项目）
profiles:
  planning: profiles/planning.yaml
  review: profiles/review.yaml
  context: profiles/context.yaml
# 题材种子（seed 策略：带 origin 导入项目，作为候选，不直接成为正史）
seeds:
  terminology: seeds/terminology.yaml
  power_system_schema: seeds/power-system-schema.yaml
# 题材特有初始化规划任务（installer 在其标准 TASK-001..009 之后接续）
initial_tasks:
  - project_discovery
  - story_promise
  - worldbuilding
  - character_design
  - outline_design
# 玄幻特有 NKB 组件（在 schemas/nkb/nkb-manifest.yaml 基础上附加；当前为空，
# 未来如需要修炼体系表 Cultivation 在此追加，init_nkb 会生成对应空结构）
extra_nkb_components: []
