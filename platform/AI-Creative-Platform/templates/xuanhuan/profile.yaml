schema_version: "1.3.0"
# 玄幻类型项目模板（Phase 3-7 Project Templates）
# 脚手架时由 platform init-project 读取本文件：
#  - schema_version 写入新项目 project.yaml 的 requires.templates.<genre>
#  - genre 须与目录名一致（脚手架校验）
genre: xuanhuan
display_name: 玄幻
description: 东方玄幻/修真/仙侠类长篇；含修炼体系、宗门江湖、战斗副本、长生等母题。
defaults:
  gates:
    editor_score: 80
    consistency_index: 0.95
    reader_index: 60
    payment_intent: 60
  capabilities:
    - capability.narrative.default@2.0.0
    - capability.character.default@1.5.0
    - capability.dialogue.ancient@1.3.0
    - capability.battle.xuanhuan@2.1.0
    - capability.emotion.commercial@1.2.0
    - capability.description.ancient@1.1.0
