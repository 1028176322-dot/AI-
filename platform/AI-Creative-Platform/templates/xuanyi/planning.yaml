# 类型模板 · 悬疑 · 规划默认值（L3 规划者加载）
schema_version: 1.3.0
genre: xuanyi
application_mode: adaptive_preferences
template_policy:
  advisory_only: true
  derive_from: [chapter_role, scene_type, environment_function, character_state, reader_promise]
  forbid_forced_full_curve: true
  forbid_three_chapter_boundary_reuse: true
story_beat_emphasis:
  hook: 异常事件
  inciting: 发现线索/尸体
  escalation: 误导与反转
  climax: 真相揭露
  resolution: 余波与代价
emotion_curve_template: [好奇, 紧张, 误判, 震撼, 释然]
beat_preferences:
  foreshadow_window: 60
conflict_policy:
  min_per_chapter: 1
