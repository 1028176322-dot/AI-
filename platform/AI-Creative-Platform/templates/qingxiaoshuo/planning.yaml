# 类型模板 · 轻小说 · 规划默认值（L3 规划者加载）
schema_version: 1.3.0
genre: qingxiaoshuo
application_mode: adaptive_preferences
template_policy:
  advisory_only: true
  derive_from: [chapter_role, scene_type, environment_function, character_state, reader_promise]
  forbid_forced_full_curve: true
  forbid_three_chapter_boundary_reuse: true
story_beat_emphasis:
  hook: 有趣设定
  inciting: 日常小事件
  escalation: 吐槽与温情
  climax: 轻松高潮
  resolution: 会心收尾
emotion_curve_template: [轻松, 笑点, 微温, 会心]
beat_preferences:
  foreshadow_window: 40
conflict_policy:
  min_per_chapter: 0
  allow_low_conflict: true
