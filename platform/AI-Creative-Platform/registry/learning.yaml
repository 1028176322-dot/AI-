schema_version: "2.0.0"

reference_learning:
  supported_extensions: [.txt, .md]
  extraction_mode: statistics_and_principles_only
  raw_excerpt_copy: forbidden
  candidate_targets: [writing, review, both]
  activation_scope: current_project_experiment
  project_activation_requires:
    - governed_task
    - explicit_user_approval
  promotion:
    source_count_is_not_project_validation: true
    genre_requires_independent_projects: 3
    global_requires_independent_genres: 2
    required_status: validated
  style_dimensions:
    - narrative_pov
    - narrative_distance
    - syntactic_rhythm
    - information_function
    - description_selection
    - sensory_preference
    - emotion_expression
    - dialogue_method
    - metaphor_mechanism
    - omission_method
    - scene_closure
    - prohibited_patterns
  minimum_independent_sources: 3
  recommended_independent_sources: 5
  max_single_source_weight: 0.4
  fingerprint: hmac-sha256-shingles+minhash
  secret_storage: external_only

style_system:
  version: "1.0.0"
  implementation_status: core/learning/风格系统实施状态.md
  schema_dir: core/learning/schemas
  schemas:
    - authorization-policy.schema.yaml
    - capability-token.schema.yaml
    - chapter-apply-result.schema.yaml
    - chapter-rollback-result.schema.yaml
    - diagnosis.schema.yaml
    - final-regression-result.schema.yaml
    - nkb-sync-proof.schema.yaml
    - nkb-validation-report.schema.yaml
    - fidelity-report.schema.yaml
    - protected-manifest.schema.yaml
    - quality-policy.schema.yaml
    - revision-candidate-state.schema.yaml
    - revision-result.schema.yaml
    - style-archetype.schema.yaml
    - style-card.schema.yaml
    - style-guidance.schema.yaml
    - style-profile.schema.yaml
    - style-quality-report.schema.yaml
    - style-rule-candidate.schema.yaml
    - task-event.schema.yaml
  policies:
    authorization: core/learning/schemas/authorization-policy.schema.yaml
    quality: core/learning/quality-policies/default.yaml
  strict_project_profile: strict-v2

review_feedback:
  recurring_min_occurrences: 2
  recurring_min_chapters: 2
  outputs:
    ledger: memory/project/review-feedback/feedback-ledger.yaml
    writing_guidance: runtime/learning/writing-guidance.yaml
    review_regression: runtime/learning/review-regression.yaml

reader_learning:
  ai_panel_is_prediction: true
  human_feedback_is_observation: true
  human_calibration_min_participants: 3
  never_merge_identity: true
  required_milestones: [pilot, volume_end, paid_boundary, major_revision]
