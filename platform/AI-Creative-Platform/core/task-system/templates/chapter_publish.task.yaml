task_template:
  type: chapter_publish
  version: "1.1.0"
  required_role: publish_service
  description: 正式章节只能由 Publish Service 原子发布并更新 canonical manifest。
  required_inputs: [chapter_draft, review_report]
  allowed_outputs: [published_chapter, canonical_manifest]
  permissions:
    read:
      - chapters/**
      - NKB/**
      - tasks/running/<id>/outputs/**
      - operations/grants/**
    write:
      - chapters/approved/**
      - 第一卷_道生/**
      - 第二卷_京华/**
      - 第三卷_江湖/**
      - 第四卷_国战/**
      - 第五卷_长生/**
      - 第六卷_乾坤/**
      - canonical_manifest.yaml
      - operations/grants/**
    forbidden: [core/**, registry/**, templates/**]
  execution_policy:
    agent_mode: single
    delegation_allowed: false
    subagent_allowed: false
    parallel_execution_allowed: false
    max_agents: 1
    max_parallel_steps: 1
    required_session: current
    service_identity: publish_service
  next_tasks:
    on_pass: [outline_refresh]
    on_fail: []
