task_template:
  type: chapter_review
  version: "1.0.0"
  required_role: reviewer
  description: 章节审查（四支柱评分卡，不跑 quality/reader 门禁——它是门禁执行者）
  required_inputs: [chapter_draft, review_spec]
  allowed_outputs: [review_report, findings]
  permissions:
    read: [chapters/**, NKB/**, tasks/running/<id>/outputs/**]
    write: [tasks/running/<id>/outputs/**, analysis/review/**]
    forbidden: [core/**, registry/**, templates/**, NKB/**, chapters/approved/**]
  next_tasks:
    on_pass: [chapter_publish]
    on_fail: [chapter_fix]
