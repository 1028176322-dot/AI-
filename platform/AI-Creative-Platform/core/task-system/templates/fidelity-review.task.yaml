task_template:
  type: fidelity-review
  version: "1.0.0"
  required_role: reviewer
  description: 保真度审查；校验 revision-candidate 与 protected-manifest 一致性
  required_inputs: [chapter_draft, revision_candidate, protected_manifest]
  allowed_outputs: [fidelity_report]
  permissions:
    read: [chapters/drafts/**, analysis/style/**]
    write: [analysis/style/**]
    forbidden: [core/**, registry/**, templates/**, chapters/drafts/**, chapters/approved/**]
  execution_policy:
    agent_mode: single
    delegation_allowed: false
    subagent_allowed: false
    parallel_execution_allowed: false
    max_agents: 1
    max_parallel_steps: 1
    required_session: current
  next_tasks:
    on_pass: [style-quality-review]
    on_fail: [style-rule-review]
