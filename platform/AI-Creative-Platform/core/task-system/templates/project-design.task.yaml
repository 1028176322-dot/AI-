task_template:
  type: project_design
  version: "1.0.0"
  required_role: project-producer
  description: 单 Agent 串行完成项目分域设计及五级大纲；只写候选、设计源和大纲候选，不写正文或 NKB。
  required_inputs: [inspiration_brief, autonomy_policy, design_gap_matrix]
  allowed_outputs: [design_sources, design_candidates, outline_sources, outline_generation_plan, design_handoff]
  permissions:
    read: [sources/**, NKB/**, runtime/learning/**, analysis/design/**]
    write: [tasks/running/<id>/outputs/**, sources/design/_candidates/**, sources/outline/**, analysis/design/**, analysis/outline/**, runtime/outline/**]
    forbidden: [core/**, registry/**, templates/**, NKB/**, chapters/approved/**]
  execution_policy:
    agent_mode: single
    delegation_allowed: false
    subagent_allowed: false
    parallel_execution_allowed: false
    max_agents: 1
    max_parallel_steps: 1
    required_session: current

  next_tasks:
    on_submit: [design_review]
