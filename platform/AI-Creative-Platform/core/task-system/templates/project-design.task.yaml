task_template:
  type: project_design
  version: "1.0.0"
  required_role: project-producer
  description: 项目级设计（世界观/大纲/设定架构，不写正文）
  required_inputs: [outline_brief, market_signal]
  allowed_outputs: [design_doc, handoff]
  permissions:
    read: [sources/**, NKB/**]
    write: [tasks/running/<id>/outputs/**, designs/**]
    forbidden: [core/**, registry/**, templates/**, NKB/**, chapters/approved/**]
  execution_policy:
    agent_mode: single
    delegation_allowed: false
    subagent_allowed: false
    parallel_execution_allowed: false
    max_agents: 1
    max_parallel_steps: 1
    required_session: current

  next_tasks:
    on_submit: [chapter_plan]
