task_template:
  type: chapter_write
  version: "1.0.0"
  required_role: writer
  description: 章节正文写作（受控写，产物先落任务工作区）
  required_inputs: [chapter_plan, final_context, nkb_snapshot, previous_chapter_handoff]
  allowed_outputs: [chapter_draft, self_check, candidate_facts, handoff]
  permissions:
    read: [NKB/**, sources/outline/**, chapters/approved/**]
    write: [tasks/running/<id>/outputs/**, chapters/drafts/**]
    forbidden: [core/**, registry/**, templates/**, NKB/**, chapters/approved/**]
  next_tasks:
    on_submit: [chapter_review]
