task_template:
  type: ai-diagnose
  version: "2.0.0"
  required_role: writer
  description: 风格风险诊断（只读）；输出 diagnosis-report，不改正文
  required_inputs: [chapter_draft, protected_manifest, style_guidance]
  allowed_outputs: [diagnosis_report]
  permissions:
    read: [chapters/drafts/**, NKB/**, analysis/style/**]
    write: [analysis/style/**]
    forbidden: [core/**, registry/**, templates/**, chapters/drafts/**, chapters/approved/**]
  execution_policy:
    agent_mode: single
    delegation_allowed: false
    subagent_allowed: false
    parallel_execution_allowed: false
    max_agents: 1
    max_parallel_steps: 1
    required_session: current
  next_tasks:
    on_clean: [final-regression]
    on_warning: [human_gate]
    on_issues: [style-revise]
  event_contracts:
    on_clean:
      required_outputs: [diagnosis_report]
      required_bindings: [source_draft_sha256, protected_manifest_sha256]
    on_warning:
      required_outputs: [diagnosis_report]
      required_bindings: [source_draft_sha256, protected_manifest_sha256]
    on_issues:
      required_outputs: [diagnosis_report]
      required_bindings: [source_draft_sha256, protected_manifest_sha256]
