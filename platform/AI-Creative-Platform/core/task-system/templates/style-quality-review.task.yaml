task_template:
  type: style-quality-review
  version: "2.0.0"
  required_role: reviewer
  description: 风格质量门禁；按 quality-policy 版本化阈值判定
  required_inputs: [revision_candidate, quality_policy, style_guidance, fidelity_report]
  allowed_outputs: [quality_report]
  permissions:
    read: [analysis/style/**, core/learning/quality-policies/**]
    write: [analysis/style/**]
    forbidden: [core/**, registry/**, templates/**, chapters/drafts/**, chapters/approved/**]
  execution_policy:
    agent_mode: single
    delegation_allowed: false
    subagent_allowed: false
    parallel_execution_allowed: false
    max_agents: 1
    max_parallel_steps: 1
    required_session: current
  next_tasks:
    on_pass: [chapter-apply-revision]
    on_fail: [human_gate]
  event_contracts:
    on_pass:
      required_outputs: [quality_report]
    on_fail:
      required_outputs: [quality_report]
