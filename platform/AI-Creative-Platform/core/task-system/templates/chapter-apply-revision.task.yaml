task_template:
  type: chapter-apply-revision
  version: "2.0.0"
  required_role: writer
  description: 受控写候选修订到草稿；CAS 校验 + pre_apply 备份
  required_inputs: [chapter_draft, revision_candidate, revision_result, fidelity_report, quality_report, apply_readiness, protected_manifest, style_guidance]
  allowed_outputs: [apply_result, pre_apply_backup]
  permissions:
    read: [chapters/drafts/**, analysis/style/**]
    write: [chapters/drafts/**, analysis/style/**]
    forbidden: [core/**, registry/**, templates/**, chapters/approved/**]
  execution_policy:
    agent_mode: single
    delegation_allowed: false
    subagent_allowed: false
    parallel_execution_allowed: false
    max_agents: 1
    max_parallel_steps: 1
    required_session: current
  next_tasks:
    on_complete: [final-regression]
  event_contracts:
    on_complete:
      required_outputs: [apply_result, pre_apply_backup]
      required_bindings: [pre_apply_sha256, candidate_sha256, applied_draft_sha256]
