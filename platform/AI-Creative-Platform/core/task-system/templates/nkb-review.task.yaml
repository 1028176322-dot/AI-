task_template:
  type: nkb_sync
  version: "2.0.0"
  required_role: reviewer
  description: 对 NKB 更新执行 canonical 校验，并生成章节发布所需的同步证明。
  required_inputs: [nkb_change, operation_manifest, nkb_snapshot_after]
  allowed_outputs: [nkb_sync_proof, validation_report]
  permissions:
    read: [NKB/**, operations/**, tasks/**, sources/**]
    write: [tasks/running/<id>/outputs/**, analysis/nkb/**]
    forbidden: [core/**, registry/**, templates/**, chapters/**, NKB/**]
  execution_policy:
    agent_mode: single
    delegation_allowed: false
    subagent_allowed: false
    parallel_execution_allowed: false
    max_agents: 1
    max_parallel_steps: 1
    required_session: current
  next_tasks:
    # NKB 回补可能改变 revision/hash；发布前必须自动重绑最终快照。
    on_pass: [protected-manifest-build]
    on_fail: [nkb_update]
  event_contracts:
    on_pass:
      required_outputs: [nkb_sync_proof, validation_report]
    on_fail:
      required_outputs: [validation_report]
