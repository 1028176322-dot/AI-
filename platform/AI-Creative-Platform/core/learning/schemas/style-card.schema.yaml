schema:
  id: style.card
  version: "2.0.0"
  description: L0-L4 风格卡；只保存经治理批准的项目约束、偏好和统计目标。
fields:
  - name: card_id
    type: string
    required: true
  - name: layer
    type: enum
    required: true
    enum: [L0, L1, L2, L3, L4]
  - name: scope
    type: object
    required: true
    description: content_type / scene_types / character_ids / span_selector
  - name: project_constraints
    type: list
    required: false
    description: 仅容纳用户或项目明确批准的约束；参考学习不得写入。
  - name: style_preferences
    type: list
    required: false
    description: 经审核激活的软偏好；每条必须带 lifecycle_state 与 scope。
  - name: style_targets
    type: list
    required: false
    description: 可校准的统计目标区间，不得当作文学质量真值。
  - name: governance_policy_ref
    type: string
    required: true
  - name: governance_policy_sha256
    type: string
    required: true
  - name: conflict_policy
    type: object
    required: true
    description: 冲突时确定性选胜，并记录 suppressed_rules 和原因。
  - name: effective_priority
    type: string
    required: true
  - name: applicable_scenes
    type: list
    required: false
  - name: character_ids
    type: list
    required: false
    description: L3 角色卡必填，且规则只允许作用于 dialogue。
  - name: author_id
    type: string
    required: false
    description: L4 作者卡必填。
rule_contract:
  required_fields: [rule_id, rule_class, lifecycle_state, scope, value, source]
  active_states: [ACTIVE, APPROVED]
  inactive_states: [EXTRACTED, REVIEW_PENDING, SUSPENDED, REVOKED, REJECTED]
  forbidden_fields: [hard_constraints, scoped_constraints, soft_preferences, targets]
  reference_learning_allowed_classes: [style_preference, style_target]
  reference_learning_forbidden_classes: [project_constraint, hard_constraint]
