# Role Registry（角色注册表：权限即分工，不靠自觉）
schema_version: "1.0.0"

roles:
  writer:
    purpose: 生成和修改正文 Draft
    capabilities: [chapter_write, dialogue_expand, scene_expand]
    may_write:
      - chapters/drafts/**
      - artifacts/plans/**
      - artifacts/context/**
    may_not_write:
      - core/**
      - registry/**
      - templates/**
      - NKB/**
      - approved/**
      - chapters/**   # 仅 drafts 子目录可写
    requires:
      - project_yaml
      - chapter_plan
      - final_context

  reviewer:
    purpose: 审查 Draft 并产出 Review Report
    capabilities: [chapter_review, consistency_check]
    may_write:
      - artifacts/reviews/**
      - artifacts/fix-proposals/**
    may_not_write:
      - core/**
      - registry/**
      - NKB/**
      - approved/**
      - chapters/**   # 不得改正文
    requires:
      - build_id
      - nkb_snapshot

  fixer:
    purpose: 按 Review Report 修复 Draft
    capabilities: [chapter_fix, continuity_fix]
    may_write:
      - chapters/drafts/**
      - artifacts/fix-logs/**
    may_not_write:
      - core/**
      - registry/**
      - NKB/**
      - approved/**
    requires:
      - review_report
      - fix_scope

  knowledge-manager:
    purpose: 更新项目事实（NKB）
    capabilities: [nkb_update, candidate_review]
    may_write:
      - NKB/**
    may_not_write:
      - core/**
      - registry/**
      - chapters/**
      - approved/**
    requires:
      - approved_event
      - source_chapter
      - event_id

  system-maintainer:
    purpose: 修改平台规范（core/registry/templates）
    may_write:
      - core/**
      - registry/**
      - templates/**
    may_not_write:
      - projects/**/NKB/**
      - projects/**/approved/**
    requires:
      - explicit_user_approval

  # ── 前期生命周期角色（P0–P5，区别于 P6 生产角色）──
  idea-analyst:
    purpose: 整理与评估创意候选（P0）
    may_write:
      - lifecycle/idea/**
    may_not_write:
      - core/**
      - registry/**
      - templates/**
      - NKB/**
      - sources/**
      - chapters/**
      - approved/**
    requires:
      - project_yaml

  project-producer:
    purpose: 立项与范围定义（P1/P2 initiation+definition）
    may_write:
      - lifecycle/initiation/**
      - lifecycle/definition/**
    may_not_write:
      - core/**
      - registry/**
      - templates/**
      - NKB/**
      - sources/**
      - chapters/**
      - approved/**
    requires:
      - idea_approved

  market-reader-analyst:
    purpose: 受众与定位分析（P2 definition）
    may_write:
      - lifecycle/definition/AUDIENCE.yaml
      - lifecycle/definition/POSITIONING.yaml
      - lifecycle/definition/CONTENT_BOUNDARIES.yaml
    may_not_write:
      - core/**
      - registry/**
      - templates/**
      - NKB/**
      - sources/**
      - chapters/**
      - approved/**
    requires:
      - project_brief

  story-architect:
    purpose: 故事架构设计（P3 story/outline）
    may_write:
      - sources/design/story/**
      - sources/outline/**
    may_not_write:
      - core/**
      - registry/**
      - templates/**
      - NKB/**
      - chapters/**
      - approved/**
    requires:
      - project_brief
      - scope_defined

  world-designer:
    purpose: 世界与设定设计（P3 canon/design）
    may_write:
      - sources/canon/**
      - sources/design/world/**
      - sources/design/locations/**
      - sources/design/factions/**
      - sources/design/items/**
      - sources/design/abilities/**
      - sources/design/conflicts/**
      - sources/design/arcs/**
      - sources/design/foreshadow/**
    may_not_write:
      - core/**
      - registry/**
      - templates/**
      - NKB/**
      - chapters/**
      - approved/**
    requires:
      - project_brief

  character-designer:
    purpose: 人物设计（P3 characters）
    may_write:
      - sources/design/characters/**
    may_not_write:
      - core/**
      - registry/**
      - templates/**
      - NKB/**
      - chapters/**
      - approved/**
    requires:
      - project_brief

  knowledge-engineer:
    purpose: NKB Genesis 与前期知识准备（P4）
    may_write:
      - NKB/**
      - sources/**
    may_not_write:
      - core/**
      - registry/**
      - templates/**
      - chapters/**
      - approved/**
    requires:
      - validated_sources

  readiness-reviewer:
    purpose: 开写验收（P5 Readiness Gate）
    may_write:
      - lifecycle/readiness/**
    may_not_write:
      - core/**
      - registry/**
      - templates/**
      - NKB/**
      - sources/**
      - chapters/**
      - approved/**
    requires:
      - lifecycle_artifacts
      - nkb_genesis

  # ── 任务系统角色（Phase 1 操作中心）──
  planner:
    purpose: 目标拆解与规划（Goal -> Tasks）
    capabilities: [goal_decompose, plan_write]
    may_write:
      - tasks/goals/**
      - artifacts/plans/**
    may_not_write:
      - core/**
      - registry/**
      - NKB/**
      - chapters/**
      - approved/**
    requires:
      - project_brief

  task-scheduler:
    purpose: 任务路由/调度/管理（操作中心治理）
    capabilities: [task_route, task_admin]
    may_write:
      - tasks/**
      - project/status.yaml
      - audit/**
    may_not_write:
      - core/**
      - registry/**
      - NKB/**
      - chapters/**
      - approved/**
    requires:
      - platform_config

  status-updater:
    purpose: 写入项目生产状态（project/status.yaml）
    capabilities: [status_write]
    may_write:
      - project/status.yaml
    may_not_write:
      - core/**
      - registry/**
      - NKB/**
      - chapters/**
      - tasks/**
      - approved/**
    requires:
      - task_system
  impact-analyzer:
    purpose: 变更影响分析（Impact Analyzer），产出影响报告与门禁建议
    capabilities: [impact_analysis]
    may_write:
      - analysis/impact/**
      - analysis/index/**
    may_not_write:
      - core/**
      - registry/**
      - templates/**
      - NKB/**
      - chapters/**
      - approved/**
      - tasks/**
      - sources/**
    requires:
      - project_root
  quality-scorer:
    purpose: 内容质量评分（Quality Score），产出质量分与门禁建议
    capabilities: [quality_score]
    may_write:
      - analysis/quality/**
    may_not_write:
      - core/**
      - registry/**
      - templates/**
      - NKB/**
      - chapters/**
      - approved/**
      - tasks/**
      - sources/**
    requires:
      - project_root
  reader-sim:
    purpose: 读者体验模拟（Reader Simulation），产出读者模拟报告与门禁建议
    capabilities: [reader_sim]
    may_write:
      - analysis/reader/**
    may_not_write:
      - core/**
      - registry/**
      - templates/**
      - NKB/**
      - chapters/**
      - approved/**
      - tasks/**
      - sources/**
    requires:
      - project_root
  memory-governor:
    purpose: 内存治理（Memory Governance），对 platform/memory/ 四层经验库做体检与门禁建议（只读 memory/ 本身）
    capabilities: [memory_gov]
    may_write:
      - analysis/memory/**
    may_not_write:
      - memory/**
      - core/**
      - registry/**
      - templates/**
      - NKB/**
      - chapters/**
      - approved/**
      - tasks/**
      - sources/**
    requires:
      - project_root

  asset-manager:
    purpose: 资产管理（Asset Management），对项目内容资产（章节/NKB/sources/artifacts/参考/图片）做盘点与引用完整性体检（只读内容）
    capabilities: [asset_mgmt]
    may_write:
      - analysis/asset/**
    may_not_write:
      - txt/**
      - NKB/**
      - sources/**
      - artifacts/**
      - 参考资料/**
      - 图片/**
      - "*.md"
      - core/**
      - registry/**
      - templates/**
      - tasks/**
      - memory/**
    requires:
      - project_root

  model-router:
    purpose: 模型布线（Model Router），决定任务/角色用哪个模型（只读 registry/models.yaml + model-router.yaml）
    capabilities: [model_route]
    may_write:
      - analysis/model-router/**
    may_not_write:
      - core/**
      - registry/**
      - templates/**
      - NKB/**
      - chapters/**
      - approved/**
      - tasks/**
      - sources/**
    requires:
      - platform_root

  multi-project:
    purpose: 多项目管理（Multi-Project），跨项目注册 / 隔离等级解析 / 统一 dispatch（只读项目、写自身注册表）
    capabilities: [project_query, project_dispatch]
    may_write:
      - registry/projects.yaml
      - analysis/multi-project/**
    may_not_write:
      - core/**
      - templates/**
      - NKB/**
      - chapters/**
      - approved/**
      - tasks/**
      - sources/**
    requires:
      - platform_root

  experiment-runner:
    purpose: 实验系统（Experiment），定义 A/B 实验 / 分配 variant / 回收指标 / 判定胜者（只读项目与模型、写自身注册表+样本）
    capabilities: [experiment_run]
    may_write:
      - registry/experiments.yaml
      - analysis/experiment/**
    may_not_write:
      - core/**
      - templates/**
      - NKB/**
      - chapters/**
      - approved/**
      - tasks/**
      - sources/**
    requires:
      - platform_root

  bi-analyst:
    purpose: BI 分析（Business Intelligence），聚合 quality/reader/experiment 既有数据产出 rollup + dashboard（只读分析产出、写自身仪表盘）
    capabilities: [bi_rollup, bi_dashboard]
    may_write:
      - registry/bi.yaml
      - analysis/bi/**
    may_not_write:
      - core/**
      - templates/**
      - NKB/**
      - chapters/**
      - approved/**
      - tasks/**
      - sources/**
      - txt/**
    requires:
      - platform_root
      - project_root

  graph-viz:
    purpose: 图谱可视化（Knowledge Graph Viz），把 NKB 组件转 graph JSON 并渲染 HTML/SVG（只读 NKB、写 analysis/graph/**）
    capabilities: [graph_build, graph_render]
    may_write:
      - analysis/graph/**
    may_not_write:
      - core/**
      - registry/**
      - templates/**
      - NKB/**
      - chapters/**
      - approved/**
      - tasks/**
      - sources/**
      - txt/**
    requires:
      - project_root

  market-analyst:
    purpose: 市场分析（Market Analysis），摄取市场信号→机会打分→brief，可选写入 NKB Market 组件（只读 sources、写 analysis/market + NKB/Market.yaml）
    capabilities: [market_ingest, market_score, market_sync]
    may_write:
      - registry/market.yaml
      - analysis/market/**
      - NKB/Market.yaml
    may_not_write:
      - core/**
      - templates/**
      - chapters/**
      - approved/**
      - tasks/**
      - txt/**
    requires:
      - platform_root
      - project_root

  project-initiator:
    purpose: 脚手架新项目（init-project）：从 genre 模板生成 project.yaml/空NKB/sources 并注册到多项目与 workspace
    capabilities: [project_scaffold, project_register]
    may_write:
      - projects/**                # 新建项目实例（含空 NKB / sources / overrides / lifecycle）
      - registry/projects.yaml     # 多项目注册
      - workspace.yaml             # workspace 登记
      - sources/research/market/** # 市场钩子种子
    may_not_write:
      - core/**
      - templates/**               # 读模板，不写模板
      - chapters/**
      - approved/**
      - tasks/**
    requires:
      - platform_root
      - workspace_root
