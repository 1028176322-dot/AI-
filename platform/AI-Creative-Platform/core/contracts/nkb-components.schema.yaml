schema_id: nkb-components
version: 1.3.0
applies_to: [NKB/manifest.yaml, NKB/*.yaml]
strict_project_only: true
common:
  required: [id, source]
  id_pattern: "^[A-Z][A-Z0-9_-]{1,63}$"
  source_required:
    - source_type
    - source_file
    - source_anchor
    - source_version
    - approval_status
  approval_status_enum: [approved, derived]
components:
  Canon:
    required: [id, category]
    required_any: [name, statement, detail]
  Characters:
    required: [id, name, status, identity, personality, goal, abilities, relationships, speech]
  Locations:
    required: [id, name, type, status]
  Organizations:
    required: [id, name, type, status, goals, relationships]
  Timeline:
    required: [id, chapter, event_id, story_time]
    references: [event_id]
  WorldState:
    required: [id, state, derived_from]
    references_many: [derived_from]
  Events:
    required: [id, name, chapter, participants, cause, effect, state_deltas, truth_status]
    references_many: [participants]
    truth_status_enum: [designed, occurred, revealed, believed, claimed]
  Foreshadow:
    required: [id, content, status, planted_at, payoff_window, related_entities]
    references_many: [related_entities]
    status_enum: [planned, planted, advanced, paid_off, abandoned]
  Assets:
    required: [id, name, type, state, abilities, limitations]
    references: [owner, acquired_event, lost_event]
  Terminology:
    required: [id, name, canonical, forbidden]
  StoryState:
    required: [id, state, active_conflicts, unresolved_questions, next_constraints]
    references_many: [active_conflicts]
  ReaderState:
    required: [id, fact_id, epistemic_status, learned_at, evidence]
    references: [fact_id]
    epistemic_status_enum: [known, believed, suspected, unknown, false_belief]
  Graph:
    required: [id, nodes, edges]
  Derived:
    required: [id, derived_from]
    references_many: [derived_from]
legacy:
  missing_component_severity: warn
  missing_field_severity: warn
  broken_reference_severity: warn
