# platform.yaml — 平台一级入口（总索引与启动清单）
#
# 设计原则：声明平台「需要什么」（索引 + 启动清单），不包含所有规则正文。
# 三者互补、不可互替：
#   - AGENTS.md   ：AI 行为入口（强制从哪里开始、禁止什么）
#   - platform.yaml：平台机器入口（组件在哪里、应调用什么）
#   - README.md   ：人类说明
#
# 版本对齐 registry/versions.yaml（core.platform=2.1.0, review=4.4.0, contract=1.4.0）。
# 路径决策（见 2026-07-25 评审）：
#   - projects 保留在仓库根（paths.projects = ../../projects）；
#   - schemas 仅做索引（schemas/registry.yaml 指向 core/contracts，不迁移实体）；
#   - tools 已阶段2 迁移至 cli/ + scripts/（tools/ 目录已删除）。
schema: platform-manifest@1.0

platform:
  id: ai-creative-platform
  name: AI创作运行平台
  version: 2.1.0
  architecture_version: 4.4.0
  language: zh-CN

entrypoints:
  cli: cli/platform.py                 # 阶段2 由 tools/platform_cli.py 迁移
  agents: AGENTS.md
  memory: memory/MEMORY.md
  architecture: ARCHITECTURE.md
  core: core/core.yaml

paths:
  core: core/
  templates: templates/
  schemas: schemas/
  registry: registry/
  projects: ../../projects           # 项目在仓库根（Q1：保留仓库根）
  scripts: scripts/                   # 阶段2 由 tools/ 迁移而来（引擎脚本）
  migrations: migrations/             # 阶段2 创建
  runtime: runtime/                   # 平台级 runtime（阶段2 创建；项目级 runtime 在 projects/<id>/runtime）

registries:
  projects: registry/projects.yaml
  templates: templates/registry.yaml
  plugins: registry/plugins.yaml
  capabilities: registry/capabilities.yaml
  schemas: schemas/registry.yaml
  versions: registry/versions.yaml
  learning: registry/learning.yaml
  readers: registry/readers.yaml
  author_executors: registry/author-executors.yaml

schemas:
  index: schemas/registry.yaml        # 实体文件位于 core/contracts/（Q2：仅索引，不迁移）

installers:
  project:
    command: platform project create
    implementation: scripts/project/project_template.py
    deployment_builder: scripts/project/project_init.py
    validator: scripts/project/project_health.py
    staging_path: runtime/staging/              # 阶段2

session:
  bootstrap_command: platform session bootstrap
  close_command: platform session close
  runtime_path: ../../projects/<project-id>/runtime/sessions/
  require_bootstrap_validation: true

runtime:
  agent_mode: single
  subagents_enabled: false
  delegation_allowed: false
  parallel_agents_allowed: false
  max_active_agents: 1

governance:
  constitution: core/constitution/AI写作宪法.md
  base_policy: core/policies/compliance.policy.yaml
  runtime_policy: core/policies/agent-execution.policy.yaml
  project_creation_policy: core/policies/workflow.policy.yaml

# 编辑≠发布：六因子授权 + Publish Service（根治「正式章节写权限断链」）
#   core_dir           : 授权模型五 YAML（actions/resources/roles/state-permissions/immutable-policies）
#   publish_service    : Publish Service 确定性脚本（唯一可写 canonical 的服务身份）
#   manifest           : 项目根 canonical_manifest.yaml（正式正文真相源索引）
#   default_decision   : 默认拒绝（六因子联立才放行）
authorization:
  core_dir: core/authorization/
  publish_service: scripts/publish/publish_chapter.py
  manifest: canonical_manifest.yaml
  immutable_baseline: core/authorization/immutable-policies.yaml
  default_decision: deny

memory:
  index: memory/MEMORY.md
  global: memory/global/
  genre: memory/genre/
  rejected: memory/rejected/
  cross_project_isolation: true

learning:
  reference_pipeline: scripts/learning/reference_learning.py
  feedback_pipeline: scripts/learning/feedback_learning.py
  reader_panel: scripts/platform/reader_panel.py
  project_layout: scripts/project/project_layout.py
  source_count_is_not_project_validation: true
  ai_reader_is_not_human_feedback: true

quality_gates:
  platform_bootstrap: required
  project_creation: required
  project_initialization: required
  task_execution: required
  artifact_registration: required

commands:
  platform_bootstrap: platform bootstrap
  project_create: platform project create
  design_prepare: platform design prepare
  design_gate: platform design gate
  outline_prepare: platform outline prepare
  outline_validate: platform outline validate
  writing_strategy_build: platform craft build
  writing_strategy_evidence: platform craft evidence-check
  chapter_author_prepare: platform author prepare
  chapter_author_run: platform author run
  chapter_author_begin: platform author begin
  chapter_author_ingest: platform author ingest
  chapter_author_validate: platform author validate
  human_gate_inspect: platform human-gate inspect
  human_gate_authorize: platform human-gate authorize
  project_open: platform project open
  project_doctor: platform project doctor
  session_bootstrap: platform session bootstrap
  validate_all: platform validate all
  reference_learn: platform learn batch
  feedback_integrate: platform feedback ingest
  reader_panel: platform reader-panel prepare
  layout_validate: platform layout validate
  style_guidance_build: platform style guidance-build
  style_manifest_build: platform style manifest-build
  style_diagnose: platform style diagnose
  style_revise: platform style revise
  style_fidelity_review: platform style fidelity-review
  style_quality_review: platform style quality-review
  style_apply: platform style apply
  style_final_regression: platform style final-regression
  style_rollback: platform style rollback
  style_author_feedback: platform style author-feedback
  style_event_verify: platform style event-verify
  style_status: platform style status
  broker_serve: platform broker serve
  broker_deploy: platform broker deploy
  broker_status: platform broker status
  broker_acl_plan: platform broker acl-plan
  broker_acl_apply: platform broker acl-apply
  broker_acl_verify: platform broker acl-verify

override_policy:
  # 不可覆盖：任何下层配置（题材模板 / 项目 / 任务运行时）均不得修改以下键。
  immutable:
    - runtime.agent_mode
    - runtime.subagents_enabled
    - runtime.delegation_allowed
    - runtime.parallel_agents_allowed
    - governance.authority
    - quality_gates.task_execution
    - quality_gates.platform_bootstrap
  # 允许覆盖（优先级：Core Default < Genre Template < Project Override < Chapter Runtime）。
  configurable:
    - writing.chapter_length
    - writing.style
    - context.token_budget
    - review.thresholds
